<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crackle Squish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@500;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen toy. Header strip, the squishy fills the stage, a tray of squishies + controls docks at the bottom. */
:root {
  --bg: #f7eef1;
  --bg-2: #fbf5f7;
  --ink: #2d1f27;
  --ink-soft: #7a6470;
  --tray: #ffffffcc;
  --line: #e6d6dd;
  --accent: #e2557a;
  --accent-ink: #ffffff;
  --glow: #ffd6e0;
  --font-display: "Grandstander", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1418; --bg-2: #241a20; --ink: #f6e9ef; --ink-soft: #b49aa7;
    --tray: #2a1f26d9; --line: #3d2d36; --accent: #ff7a9c; --accent-ink: #2a0e18; --glow: #4a2333;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1418; --bg-2: #241a20; --ink: #f6e9ef; --ink-soft: #b49aa7;
  --tray: #2a1f26d9; --line: #3d2d36; --accent: #ff7a9c; --accent-ink: #2a0e18; --glow: #4a2333;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 38%, var(--glow), var(--bg-2) 45%, var(--bg) 100%);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  gap: 8px;
  max-width: 760px;
  margin: 0 auto;
  box-sizing: border-box;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 4.5vw, 1.9rem); margin: 0; letter-spacing: -0.01em; line-height: 1; }
h1 span { color: var(--accent); }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: 0.85rem; font-weight: 700; }
.vol { display: flex; align-items: center; gap: 8px; }
.vol label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; color: var(--ink-soft); }
input[type=range] { accent-color: var(--accent); width: 110px; }
.stage { position: relative; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
canvas.pressing { cursor: grabbing; }
.hint {
  position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
  background: var(--tray); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 16px; font-weight: 800; font-size: 0.9rem; white-space: nowrap; pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}
.hint.gone { opacity: 0; transform: translate(-50%, 8px); }
.toast {
  position: absolute; left: 50%; top: 8%; transform: translateX(-50%) scale(.9);
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; color: var(--accent);
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
.tray {
  background: var(--tray); border: 1px solid var(--line); border-radius: 22px;
  padding: 12px; display: grid; gap: 10px; backdrop-filter: blur(10px);
}
.stats { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; max-width: 220px; }
.meter i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.picks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pick {
  font: inherit; font-weight: 800; font-size: 0.82rem; color: var(--ink);
  background: transparent; border: 1.5px solid var(--line); border-radius: 14px;
  padding: 8px 6px; cursor: pointer; display: grid; justify-items: center; gap: 4px;
}
.pick .dot { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset -4px -5px 0 rgba(0,0,0,.12), inset 3px 3px 0 rgba(255,255,255,.5); }
.pick[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  font: inherit; font-weight: 800; font-size: 0.92rem; border-radius: 14px; padding: 11px 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) {
  .pick { font-size: 0.72rem; }
  input[type=range] { width: 84px; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>Crackle <span>Squish</span></h1>
      <p class="sub">Press, hold &amp; drag to crack the sugar shell. Headphones on.</p>
    </div>
    <div class="vol">
      <label for="vol">Volume</label>
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="Squishy toy. Press and drag to crack it."></canvas>
    <div class="hint" id="hint">Tap &amp; hold the squishy</div>
    <div class="toast" id="toast">Shell shattered!</div>
  </div>

  <div class="tray">
    <div class="stats">
      <span id="shellTxt">Shell 100%</span>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <span id="crunchTxt">0 crunches</span>
    </div>
    <div class="picks" id="picks"></div>
    <div class="actions">
      <button class="btn primary" id="recoat" type="button">Re-coat shell</button>
      <button class="btn" id="auto" type="button" aria-pressed="false">Auto ASMR</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- Squishy profiles: look + sound ----------
  const PROFILES = {
    peach: {
      name: "Peach", light: "#ffd9cf", base: "#ff9f8e", dark: "#e5675a",
      shell: "#fff3e6", crackLight: "#fffaf3", crackDark: "#b84a3f", face: "#5b2a2a", blush: "#ff6f7d",
      crack: { fLo: 2200, fHi: 7200, q: 1.4, gap: 0.011, dur: 0.006, gain: 1.6, pop: 0.16, popF: 1300, body: 380 },
      squish: { f: 900, bubbles: 2 }
    },
    cloud: {
      name: "Cloud", light: "#eee6ff", base: "#c6b2ff", dark: "#8f74e6",
      shell: "#ffffff", crackLight: "#ffffff", crackDark: "#6b52c4", face: "#35285e", blush: "#ff8fc3",
      crack: { fLo: 900, fHi: 3800, q: 0.8, gap: 0.007, dur: 0.010, gain: 1.3, pop: 0.05, popF: 700, body: 260 },
      squish: { f: 620, bubbles: 1 }
    },
    honey: {
      name: "Honey", light: "#ffe7a6", base: "#ffc24d", dark: "#e08a12",
      shell: "#fff0c2", crackLight: "#fff9e6", crackDark: "#9b5a05", face: "#4d2c05", blush: "#ff8a5c",
      crack: { fLo: 700, fHi: 2700, q: 3, gap: 0.019, dur: 0.012, gain: 1.7, pop: 0.35, popF: 480, body: 220 },
      squish: { f: 440, bubbles: 5 }
    },
    mint: {
      name: "Mint Ice", light: "#dcfff4", base: "#93ecd2", dark: "#3fbf9b",
      shell: "#f0fffb", crackLight: "#ffffff", crackDark: "#1f8c70", face: "#14463a", blush: "#ff9db0",
      crack: { fLo: 3600, fHi: 9800, q: 4.5, gap: 0.014, dur: 0.004, gain: 1.6, pop: 0.22, popF: 2600, body: 600 },
      squish: { f: 1100, bubbles: 1 }
    }
  };
  let P = PROFILES.peach;

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");
  const stage = $("stage"), hint = $("hint"), toast = $("toast");
  const shellTxt = $("shellTxt"), crunchTxt = $("crunchTxt"), meter = $("meter");
  const picks = $("picks"), volEl = $("vol"), autoBtn = $("auto");

  for (const [key, p] of Object.entries(PROFILES)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pick"; b.dataset.key = key;
    b.setAttribute("aria-pressed", key === "peach" ? "true" : "false");
    b.innerHTML = `<span class="dot" style="background:${p.base}"></span>${p.name}`;
    b.addEventListener("click", () => choose(key));
    picks.appendChild(b);
  }

  // ---------- Audio ----------
  let ac = null, master = null, noise = null;
  let volume = 0.8;
  try { const v = parseFloat(localStorage.getItem("cs-vol")); if (!isNaN(v)) { volume = v; volEl.value = v; } } catch (e) {}

  function initAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    // master -> compressor -> makeup gain -> brickwall limiter: loud but never clipping
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -24; comp.knee.value = 6; comp.ratio.value = 5; comp.attack.value = 0.001; comp.release.value = 0.08;
    const makeup = ac.createGain(); makeup.gain.value = 2.6;
    const limiter = ac.createDynamicsCompressor();
    limiter.threshold.value = -2; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.0005; limiter.release.value = 0.05;
    master = ac.createGain(); master.gain.value = volume;
    master.connect(comp); comp.connect(makeup); makeup.connect(limiter); limiter.connect(ac.destination);
    const len = ac.sampleRate * 2;
    noise = ac.createBuffer(1, len, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  volEl.addEventListener("input", () => {
    volume = parseFloat(volEl.value);
    if (master) master.gain.setTargetAtTime(volume, ac.currentTime, 0.02);
    try { localStorage.setItem("cs-vol", String(volume)); } catch (e) {}
  });

  function out(pan) {
    if (ac.createStereoPanner) {
      const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); p.connect(master); return p;
    }
    return master;
  }

  // one crisp fracture tick: broadband noise with a resonant colour (not a thin bandpass,
  // so it keeps the sharp "edge" a real crack has)
  function tick(t, freq, q, gain, dur, dest) {
    const src = ac.createBufferSource(); src.buffer = noise;
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = Math.min(freq * 0.35, 2500);
    const pk = ac.createBiquadFilter(); pk.type = "peaking"; pk.frequency.value = freq; pk.Q.value = q; pk.gain.value = 12;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.0004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(hp); hp.connect(pk); pk.connect(g); g.connect(dest);
    src.start(t, Math.random() * 1.8, dur + 0.03);
  }

  // the moment the shell first breaks: a hard snap plus a low knock through the jelly
  function snap(t, intensity, dest) {
    tick(t, 3500, 0.7, intensity * 1.6, 0.005, dest);
    tick(t + 0.002, 1800, 1, intensity * 1.1, 0.009, dest);
    const src = ac.createBufferSource(); src.buffer = noise;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = P.crack.body; lp.Q.value = 2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(intensity * 1.4, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    src.connect(lp); lp.connect(g); g.connect(dest);
    src.start(t, Math.random(), 0.1);
  }

  // a fracture running through the shell: one snap, then crackles that thin out
  // as the crack travels (gaps grow, a few loud ticks among many quiet ones)
  function crackle(count, intensity, pan, delay = 0, withSnap = false) {
    if (!ac || count <= 0) return;
    const c = P.crack, dest = out(pan);
    let t = ac.currentTime + 0.005 + delay;
    if (withSnap) { snap(t, intensity, dest); t += 0.006; }
    let gap = c.gap * 0.35;
    for (let i = 0; i < count; i++) {
      t += gap * (0.4 + Math.random() * 1.2) + (Math.random() < 0.08 ? c.gap * 4 : 0);
      gap *= 1.07;
      const fade = 1 - (i / count) * 0.65;
      let g = intensity * c.gain * fade * (0.12 + 0.88 * Math.pow(Math.random(), 2.2));
      if (Math.random() < 0.1) g *= 1.8;
      tick(t, c.fLo + Math.random() * (c.fHi - c.fLo), c.q, g, c.dur * (0.6 + Math.random() * 0.9), dest);
      if (Math.random() < c.pop) tick(t + 0.001, c.popF * (0.7 + Math.random() * 0.6), 1.5, g * 1.5, c.dur * 4, dest);
    }
  }

  // wet squelch + bubbles: the jelly inside
  function squish(amount, pan, release = false) {
    if (!ac) return;
    const s = P.squish, dest = out(pan), t = ac.currentTime + 0.003;
    const src = ac.createBufferSource(); src.buffer = noise;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 6;
    const f0 = s.f * (release ? 0.7 : 1.5), f1 = s.f * (release ? 1.2 : 0.35);
    lp.frequency.setValueAtTime(f0, t);
    lp.frequency.exponentialRampToValueAtTime(f1, t + 0.32);
    const g = ac.createGain();
    const peak = amount * (release ? 0.35 : 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    src.connect(lp); lp.connect(g); g.connect(dest);
    src.start(t, Math.random(), 0.5);
    const n = release ? Math.ceil(s.bubbles / 2) : s.bubbles;
    for (let i = 0; i < n; i++) bubble(t + 0.03 + Math.random() * 0.25, s.f * (0.4 + Math.random() * 0.6), amount * 0.12, dest);
  }
  function bubble(t, f, gain, dest) {
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.9, t + 0.045);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.08);
  }
  // glossy pour for re-coating
  function pour() {
    if (!ac) return;
    const t = ac.currentTime, dest = out(0);
    const src = ac.createBufferSource(); src.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 3;
    bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(2400, t + 0.7);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.3, t + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
    src.connect(bp); bp.connect(g); g.connect(dest); src.start(t, 0, 1);
    for (let i = 0; i < 6; i++) bubble(t + 0.1 + i * 0.09, 500 + i * 90, 0.06, dest);
  }

  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ---------- Soft body ----------
  const N = 72;
  const off = new Float32Array(N), vel = new Float32Array(N);
  let squash = 0, squashV = 0;
  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R = 100;
  let sx = 1, sy = 1;

  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    cx = W / 2; cy = H * 0.5;
    R = Math.max(60, Math.min(W * 0.36, H * 0.36));
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- Shell state ----------
  let integrity = 1, cracks = [], facets = [], chips = [], crunches = 0, shattered = false;
  const particles = [];

  // ---------- Interaction ----------
  const press = { on: false, virtual: false, x: 0, y: 0, amt: 0, moved: 0, lastX: 0, lastY: 0, id: null };

  function toLocal(x, y) { return [(x - cx) / (R * sx), (y - cy) / (R * sy)]; }
  function panOf(x) { return ((x - cx) / (W / 2)) * 0.8; }

  // Crack widths are bucketed so drawing can batch them.
  const WB = [0.5, 0.8, 1.2, 1.7, 2.3];
  const bucket = w => WB.reduce((b, v) => Math.abs(v - w) < Math.abs(b - w) ? v : b, WB[0]);
  const TAU = Math.PI * 2;
  const inside = (x, y) => x * x + y * y < 1.0;

  function seg(x1, y1, x2, y2, w) { cracks.push({ x1, y1, x2, y2, w: bucket(w) }); }

  // A mostly straight crack with small kinks that tapers to a hairline tip.
  function runCrack(x, y, ang, len, w0, hits, depth) {
    const pts = [[x, y]];
    let d = 0;
    while (d < len) {
      const L = 0.03 + Math.random() * 0.035;
      ang += (Math.random() - 0.5) * 0.32;
      const nx = x + Math.cos(ang) * L, ny = y + Math.sin(ang) * L;
      if (!inside(nx, ny)) break;
      const taper = 1 - d / len;
      seg(x, y, nx, ny, 0.5 + (w0 - 0.5) * taper);
      hits.push([nx, ny]);
      x = nx; y = ny; d += L; pts.push([x, y]);
      // side branches fork off at 25-50 degrees and stay thinner
      if (depth < 1 && d > 0.1 && Math.random() < 0.07) {
        const side = Math.random() < 0.5 ? 1 : -1;
        runCrack(x, y, ang + side * (0.45 + Math.random() * 0.45), (len - d) * (0.35 + Math.random() * 0.4), Math.max(0.6, w0 * taper * 0.6), hits, depth + 1);
      }
    }
    return pts;
  }
  const along = (pts, f) => pts.length > 2 ? pts[Math.min(pts.length - 1, Math.max(1, Math.round(f * (pts.length - 1))))] : null;

  // A jagged connecting crack between two points (the rings of a spiderweb fracture).
  function jag(a, b, w, hits) {
    const n = 3, dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    const px = -dy / len, py = dx / len;
    let prev = a;
    for (let i = 1; i <= n; i++) {
      const k = i / n, j = i < n ? (Math.random() - 0.5) * len * 0.25 : 0;
      const p = [a[0] + dx * k + px * j, a[1] + dy * k + py * j];
      seg(prev[0], prev[1], p[0], p[1], w); hits.push(p); prev = p;
    }
  }

  // Impact fracture: radial cracks from the press point, joined by 1-2 rings,
  // with the shard facets between them catching the light differently.
  function impactCrack(lx, ly, power) {
    if (integrity <= 0) return [];
    const hits = [[lx, ly]];
    const n = 4 + Math.round(Math.random() * 2 + power * 2);
    const base = Math.random() * TAU;
    const radials = [];
    for (let i = 0; i < n; i++) {
      const a = base + (i / n) * TAU + (Math.random() - 0.5) * (TAU / n) * 0.55;
      const len = (0.22 + power * 0.32) * (0.55 + Math.random() * 0.7);
      radials.push(runCrack(lx, ly, a, len, 1.4 + power * 0.9, hits, 0));
    }
    const rings = power > 0.75 ? [0.35, 0.75] : [0.45 + Math.random() * 0.2];
    const ringPts = rings.map(f => radials.map(r => along(r, f)));
    ringPts.forEach((ring, k) => {
      for (let i = 0; i < n; i++) {
        const a = ring[i], b = ring[(i + 1) % n];
        if (a && b && Math.random() < 0.8) jag(a, b, k === 0 ? 0.9 : 0.6, hits);
      }
    });
    // facets: wedges between neighbouring radials
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const a1 = ringPts[0][i], b1 = ringPts[0][j];
      if (a1 && b1) facets.push({ pts: [[lx, ly], a1, b1], s: (Math.random() - 0.5) * 0.5 });
      if (ringPts[1]) {
        const a2 = ringPts[1][i], b2 = ringPts[1][j];
        if (a1 && b1 && a2 && b2) facets.push({ pts: [a1, a2, b2, b1], s: (Math.random() - 0.5) * 0.42 });
      }
    }
    // crushed centre: a small chip where the shell flaked off
    if (Math.random() < 0.35 + power * 0.4) {
      const r = 0.025 + Math.random() * 0.035 * power, pts = [];
      for (let k = 0; k < 6; k++) { const a = (k / 6) * TAU + Math.random() * 0.6; const rr = r * (0.6 + Math.random() * 0.6); pts.push([lx + Math.cos(a) * rr, ly + Math.sin(a) * rr]); }
      chips.push(pts);
    }
    trimCracks();
    return hits;
  }

  // Dragging drags a single crack along behind the finger, with small forks.
  function dragCrack(ax, ay, bx, by) {
    if (integrity <= 0 || !inside(ax, ay) || !inside(bx, by)) return [];
    const hits = [];
    jag([ax, ay], [bx, by], 1.2, hits);
    if (Math.random() < 0.35) {
      const ang = Math.atan2(by - ay, bx - ax) + (Math.random() < 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.5);
      runCrack(bx, by, ang, 0.05 + Math.random() * 0.1, 0.8, hits, 2);
    }
    trimCracks();
    return hits;
  }
  function trimCracks() {
    if (cracks.length > 2600) cracks.splice(0, cracks.length - 2600);
    if (facets.length > 500) facets.splice(0, facets.length - 500);
    if (chips.length > 120) chips.splice(0, chips.length - 120);
  }

  function spawnCrumbs(hits, n) {
    for (let i = 0; i < n && hits.length; i++) {
      const [lx, ly] = hits[(Math.random() * hits.length) | 0];
      const x = cx + lx * R * sx, y = cy + ly * R * sy;
      const ang = Math.atan2(ly, lx) + (Math.random() - 0.5);
      const sp = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 80, r: 1.5 + Math.random() * 2.5, life: 0.8 + Math.random() * 0.6, t: 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, shard: false });
    }
  }
  function spawnShards(n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * 0.95;
      const x = cx + Math.cos(a) * rr * R * sx, y = cy + Math.sin(a) * rr * R * sy;
      particles.push({ x, y, vx: Math.cos(a) * (40 + Math.random() * 120), vy: -60 - Math.random() * 120, r: 5 + Math.random() * 9, life: 1.2 + Math.random() * 0.8, t: 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8, shard: true });
    }
  }

  function setIntegrity(v) {
    const before = integrity;
    integrity = Math.max(0, v);
    // flakes fall off as the shell weakens
    if (Math.floor(before * 4) > Math.floor(integrity * 4)) spawnShards(6);
    if (integrity <= 0 && !shattered) {
      shattered = true;
      spawnShards(26);
      crackle(60, 1, 0, 0.02);
      buzz([30, 30, 20, 40, 15]);
      showToast("Shell shattered!");
    }
    updateUI();
  }

  function startPress(x, y, virtual) {
    const [lx, ly] = toLocal(x, y);
    if (lx * lx + ly * ly > 1.3) return false;
    Object.assign(press, { on: true, virtual, x, y, lastX: x, lastY: y, moved: 0 });
    canvas.classList.add("pressing");
    hint.classList.add("gone");
    const power = 0.5 + Math.random() * 0.5;
    const hits = impactCrack(lx, ly, power);
    press.lx = lx; press.ly = ly;
    const shellAmt = Math.min(1, integrity * 1.4);
    crackle(Math.round((10 + hits.length * 0.9) * (0.25 + shellAmt)), 0.45 + 0.55 * shellAmt, panOf(x), 0, integrity > 0);
    squish(0.5 + 0.5 * (1 - shellAmt), panOf(x));
    spawnCrumbs(hits, integrity > 0 ? 10 : 0);
    if (integrity > 0) { crunches++; buzz([12, 18, 8, 25, 10]); } else buzz(15);
    setIntegrity(integrity - (0.045 + Math.random() * 0.03));
    return true;
  }
  function movePress(x, y) {
    if (!press.on) return;
    const dx = x - press.lastX, dy = y - press.lastY;
    press.moved += Math.hypot(dx, dy);
    press.lastX = x; press.lastY = y; press.x = x; press.y = y;
    while (press.moved > 16) {
      press.moved -= 16;
      const [lx, ly] = toLocal(x, y);
      if (lx * lx + ly * ly > 1.2) continue;
      const hits = dragCrack(press.lx, press.ly, lx, ly);
      press.lx = lx; press.ly = ly;
      const shellAmt = Math.min(1, integrity * 1.4);
      crackle(Math.round((4 + hits.length * 1.5) * (0.2 + shellAmt)), 0.35 + 0.55 * shellAmt, panOf(x));
      if (Math.random() < 0.25) squish(0.25, panOf(x));
      spawnCrumbs(hits, integrity > 0 ? 3 : 0);
      if (integrity > 0) buzz(6);
      setIntegrity(integrity - 0.007);
    }
  }
  function endPress() {
    if (!press.on) return;
    press.on = false;
    canvas.classList.remove("pressing");
    squish(0.5, panOf(press.x), true);
    // little settling crackles after letting go
    if (integrity > 0) crackle(2 + ((Math.random() * 4) | 0), 0.25, panOf(press.x), 0.06 + Math.random() * 0.1);
    squashV -= 2.5; // bounce back
  }

  canvas.addEventListener("pointerdown", e => {
    initAudio();
    if (startPress(e.offsetX, e.offsetY, false)) {
      press.id = e.pointerId;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener("pointermove", e => { if (press.on && !press.virtual && e.pointerId === press.id) movePress(e.offsetX, e.offsetY); });
  const up = e => { if (press.on && !press.virtual && e.pointerId === press.id) endPress(); };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);

  // ---------- Auto ASMR ----------
  let auto = false, autoT = 0.6, autoPlan = null;
  autoBtn.addEventListener("click", () => {
    initAudio();
    auto = !auto;
    autoBtn.setAttribute("aria-pressed", String(auto));
    autoBtn.textContent = auto ? "Auto ASMR on" : "Auto ASMR";
    autoT = 0.3;
    if (!auto && press.virtual) { endPress(); autoPlan = null; }
  });
  function runAuto(dt) {
    if (!auto) return;
    if (press.on && !press.virtual) return;
    if (autoPlan) {
      autoPlan.t += dt;
      const k = Math.min(1, autoPlan.t / autoPlan.dur);
      const x = autoPlan.x0 + (autoPlan.x1 - autoPlan.x0) * k, y = autoPlan.y0 + (autoPlan.y1 - autoPlan.y0) * k;
      movePress(x, y);
      if (k >= 1) { endPress(); autoPlan = null; autoT = 0.5 + Math.random() * 1.4; }
      return;
    }
    autoT -= dt;
    if (autoT <= 0) {
      if (integrity <= 0 && Math.random() < 0.5) { recoat(); autoT = 1.2; return; }
      const a = Math.random() * Math.PI * 2, r = Math.random() * 0.6;
      const x0 = cx + Math.cos(a) * r * R, y0 = cy + Math.sin(a) * r * R;
      const b = a + Math.PI + (Math.random() - 0.5);
      const drag = Math.random() < 0.6 ? R * (0.2 + Math.random() * 0.5) : 0;
      const x1 = x0 + Math.cos(b) * drag, y1 = y0 + Math.sin(b) * drag;
      if (startPress(x0, y0, true)) autoPlan = { x0, y0, x1, y1, t: 0, dur: 0.35 + Math.random() * 0.7 };
      else autoT = 0.2;
    }
  }

  // ---------- Controls ----------
  function recoat() {
    initAudio();
    integrity = 1; cracks = []; facets = []; chips = []; shattered = false;
    gloss = 1;
    pour();
    squashV -= 1.5;
    updateUI();
  }
  $("recoat").addEventListener("click", recoat);

  function choose(key) {
    P = PROFILES[key];
    for (const b of picks.children) b.setAttribute("aria-pressed", String(b.dataset.key === key));
    recoat();
    crunches = 0; updateUI();
  }

  let toastTimer = 0;
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
  }
  function updateUI() {
    const pct = Math.round(integrity * 100);
    shellTxt.textContent = `Shell ${pct}%`;
    meter.style.width = pct + "%";
    crunchTxt.textContent = `${crunches} crunch${crunches === 1 ? "" : "es"}`;
  }
  updateUI();

  // ---------- Render ----------
  let gloss = 0; // shimmer after re-coat
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }

  function blobPath() {
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const rr = R * (1 + off[i]);
      pts.push([cx + Math.cos(a) * rr * sx, cy + Math.sin(a) * rr * sy]);
    }
    const p = new Path2D();
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let m = mid(pts[N - 1], pts[0]);
    p.moveTo(m[0], m[1]);
    for (let i = 0; i < N; i++) {
      const nxt = pts[(i + 1) % N], mm = mid(pts[i], nxt);
      p.quadraticCurveTo(pts[i][0], pts[i][1], mm[0], mm[1]);
    }
    p.closePath();
    return p;
  }

  let last = performance.now(), time = 0;
  function frame(now) {
    let dt = Math.min(0.033, (now - last) / 1000); last = now; time += dt;
    runAuto(dt);

    // physics (two substeps for stability)
    for (let sub = 0; sub < 2; sub++) {
      const h = dt / 2;
      press.amt += ((press.on ? 1 : 0) - press.amt) * Math.min(1, h * (press.on ? 9 : 30));
      const target = press.amt * 0.2;
      squashV += (-260 * (squash - target) - 11 * squashV) * h;
      squash += squashV * h;
      let pa = 0, pd = 0;
      if (press.on) {
        const [lx, ly] = toLocal(press.x, press.y);
        pa = Math.atan2(ly, lx); pd = Math.min(1, Math.hypot(lx, ly));
      }
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        let d = a - pa; d = Math.atan2(Math.sin(d), Math.cos(d));
        const idle = reduceMotion ? 0 : 0.008 * Math.sin(time * 2.2 + a * 3);
        const tgt = idle + press.amt * (-0.16 * pd * Math.exp(-(d * d) / 0.22) + 0.04);
        const lap = off[(i + N - 1) % N] + off[(i + 1) % N] - 2 * off[i];
        vel[i] += (-200 * (off[i] - tgt) - 9 * vel[i] + 900 * lap) * h;
      }
      for (let i = 0; i < N; i++) off[i] += vel[i] * h;
    }
    sx = 1 + squash * 0.55; sy = 1 - squash;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // ground shadow
    const shY = cy + R * sy * 1.02 + 6;
    const sg = ctx.createRadialGradient(cx, shY, 0, cx, shY, R * sx);
    sg.addColorStop(0, "rgba(40,10,25,0.22)"); sg.addColorStop(1, "rgba(40,10,25,0)");
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.ellipse(cx, shY, R * sx * 1.0, R * 0.16, 0, 0, Math.PI * 2); ctx.fill();

    const path = blobPath();
    // jelly body
    const g = ctx.createRadialGradient(cx - R * 0.3 * sx, cy - R * 0.38 * sy, R * 0.08, cx, cy, R * 1.25);
    g.addColorStop(0, P.light); g.addColorStop(0.55, P.base); g.addColorStop(1, P.dark);
    ctx.fillStyle = g; ctx.fill(path);

    ctx.save();
    ctx.clip(path);
    ctx.translate(cx, cy); ctx.scale(R * sx, R * sy);

    // face
    drawFace();

    // sugar shell layer
    const shellA = Math.min(1, integrity * 2.2);
    if (shellA > 0) {
      const sgr = ctx.createLinearGradient(0, -1, 0, 1);
      sgr.addColorStop(0, hexA(P.shell, 0.42 * shellA));
      sgr.addColorStop(1, hexA(P.shell, 0.12 * shellA));
      ctx.fillStyle = sgr; ctx.fillRect(-1.6, -1.6, 3.2, 3.2);
      // shard facets: each broken piece sits at a slightly different angle
      for (const f of facets) {
        ctx.fillStyle = f.s > 0 ? `rgba(255,255,255,${f.s * shellA})` : hexA(P.crackDark, -f.s * 0.5 * shellA);
        ctx.beginPath(); ctx.moveTo(f.pts[0][0], f.pts[0][1]);
        for (let k = 1; k < f.pts.length; k++) ctx.lineTo(f.pts[k][0], f.pts[k][1]);
        ctx.closePath(); ctx.fill();
      }
      // chips: shell flaked away, showing the darker jelly beneath with a bright broken edge
      const lw = 1 / R;
      for (const c of chips) {
        ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]);
        for (let k = 1; k < c.length; k++) ctx.lineTo(c[k][0], c[k][1]);
        ctx.closePath();
        ctx.fillStyle = hexA(P.dark, 0.45 * shellA); ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${0.8 * shellA})`; ctx.lineWidth = 1.2 * lw; ctx.stroke();
      }
      // cracks, batched by width: frosted stress halo, dark fracture line, then a
      // thin offset glint where light catches the broken edge
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      const passes = [
        { o: 0, mul: 3.4, col: `rgba(255,255,255,${0.16 * shellA})` },
        { o: 0, mul: 1.15, col: hexA(P.crackDark, 0.95 * shellA) },
        { o: -0.9 * lw, mul: 0.55, col: hexA(P.crackLight, 0.95 * shellA) }
      ];
      for (const ps of passes) {
        ctx.strokeStyle = ps.col;
        for (const w of WB) {
          ctx.beginPath();
          for (const c of cracks) if (c.w === w) { ctx.moveTo(c.x1 + ps.o, c.y1 + ps.o); ctx.lineTo(c.x2 + ps.o, c.y2 + ps.o); }
          ctx.lineWidth = Math.max(0.6, w * ps.mul) * lw;
          ctx.stroke();
        }
      }
    }
    // re-coat shimmer sweep
    if (gloss > 0) {
      const x = -1.4 + (1 - gloss) * 2.8;
      const sh = ctx.createLinearGradient(x - 0.3, -1, x + 0.3, 1);
      sh.addColorStop(0, "rgba(255,255,255,0)"); sh.addColorStop(0.5, `rgba(255,255,255,${0.55 * gloss})`); sh.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sh; ctx.fillRect(-1.6, -1.6, 3.2, 3.2);
      gloss = Math.max(0, gloss - dt * 1.2);
    }
    // glossy highlight
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.3 * shellA})`;
    ctx.beginPath(); ctx.ellipse(-0.38, -0.55, 0.26, 0.11, -0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.3 * shellA})`;
    ctx.beginPath(); ctx.ellipse(-0.1, -0.74, 0.06, 0.035, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // rim
    ctx.lineWidth = 2;
    ctx.strokeStyle = hexA(P.dark, 0.35);
    ctx.stroke(path);

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t > p.life) { particles.splice(i, 1); continue; }
      p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const a = 1 - p.t / p.life;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = hexA(p.shard ? P.shell : P.crackLight, 0.9 * a);
      ctx.strokeStyle = hexA(P.crackDark, 0.35 * a); ctx.lineWidth = 1;
      ctx.beginPath();
      if (p.shard) { ctx.moveTo(-p.r, -p.r * 0.4); ctx.lineTo(p.r * 0.8, -p.r * 0.7); ctx.lineTo(p.r * 0.3, p.r * 0.8); }
      else { ctx.moveTo(-p.r, 0); ctx.lineTo(0, -p.r); ctx.lineTo(p.r, p.r * 0.5); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    if (particles.length > 400) particles.splice(0, particles.length - 400);

    requestAnimationFrame(frame);
  }

  function drawFace() {
    const squeezed = press.amt > 0.4;
    ctx.fillStyle = hexA(P.blush, 0.45);
    ctx.beginPath(); ctx.ellipse(-0.48, 0.16, 0.13, 0.07, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.48, 0.16, 0.13, 0.07, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = P.face; ctx.fillStyle = P.face;
    ctx.lineWidth = 0.035; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (squeezed) {
      // > <
      ctx.beginPath();
      ctx.moveTo(-0.4, -0.06); ctx.lineTo(-0.27, 0.0); ctx.lineTo(-0.4, 0.06);
      ctx.moveTo(0.4, -0.06); ctx.lineTo(0.27, 0.0); ctx.lineTo(0.4, 0.06);
      ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0.2, 0.07, 0.08, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      const blink = (time % 4.2) < 0.12;
      for (const ex of [-0.33, 0.33]) {
        if (blink) { ctx.beginPath(); ctx.moveTo(ex - 0.07, 0); ctx.lineTo(ex + 0.07, 0); ctx.stroke(); continue; }
        ctx.beginPath(); ctx.ellipse(ex, 0, 0.07, 0.085, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath(); ctx.arc(ex - 0.025, -0.03, 0.024, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = P.face;
      }
      // little w mouth
      ctx.beginPath();
      ctx.moveTo(-0.08, 0.15); ctx.quadraticCurveTo(-0.04, 0.21, 0, 0.16); ctx.quadraticCurveTo(0.04, 0.21, 0.08, 0.15);
      ctx.stroke();
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
