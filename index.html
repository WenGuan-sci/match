<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crackle Squish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@500;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen toy. Header strip, the squishy fills the stage, a tray of squishies + controls docks at the bottom. */
:root {
  --bg: #f7eef1;
  --bg-2: #fbf5f7;
  --ink: #2d1f27;
  --ink-soft: #7a6470;
  --tray: #ffffffcc;
  --line: #e6d6dd;
  --accent: #e2557a;
  --accent-ink: #ffffff;
  --glow: #ffd6e0;
  --font-display: "Grandstander", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1418; --bg-2: #241a20; --ink: #f6e9ef; --ink-soft: #b49aa7;
    --tray: #2a1f26d9; --line: #3d2d36; --accent: #ff7a9c; --accent-ink: #2a0e18; --glow: #4a2333;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1418; --bg-2: #241a20; --ink: #f6e9ef; --ink-soft: #b49aa7;
  --tray: #2a1f26d9; --line: #3d2d36; --accent: #ff7a9c; --accent-ink: #2a0e18; --glow: #4a2333;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(120% 80% at 50% 38%, var(--glow), var(--bg-2) 45%, var(--bg) 100%);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  gap: 8px;
  max-width: 760px;
  margin: 0 auto;
  box-sizing: border-box;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 4.5vw, 1.9rem); margin: 0; letter-spacing: -0.01em; line-height: 1; }
h1 span { color: var(--accent); }
.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: 0.85rem; font-weight: 700; }
input[type=range] { accent-color: var(--accent); width: 110px; }
.stage { position: relative; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
canvas.pressing { cursor: grabbing; }
.hint {
  position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
  background: var(--tray); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 16px; font-weight: 800; font-size: 0.9rem; white-space: nowrap; pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}
.hint.gone { opacity: 0; transform: translate(-50%, 8px); }
.toast {
  position: absolute; left: 50%; top: 8%; transform: translateX(-50%) scale(.9);
  font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; color: var(--accent);
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
.tray {
  background: var(--tray); border: 1px solid var(--line); border-radius: 22px;
  padding: 12px; display: grid; gap: 10px; backdrop-filter: blur(10px);
}
.stats { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meter { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; max-width: 220px; }
.meter i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.picks {
  display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity;
  padding-bottom: 4px; margin-bottom: -4px; scrollbar-width: thin;
}
.pick {
  flex: 0 0 auto; min-width: 74px; scroll-snap-align: start;
  font: inherit; font-weight: 800; font-size: 0.78rem; color: var(--ink);
  background: transparent; border: 1.5px solid var(--line); border-radius: 14px;
  padding: 8px 8px; cursor: pointer; display: grid; justify-items: center; gap: 4px;
}
.pick .dot { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset -4px -5px 0 rgba(0,0,0,.12), inset 3px 3px 0 rgba(255,255,255,.5); }
.pick .dot.cube { border-radius: 8px; }
.pick .dot.star { clip-path: polygon(50% 0, 63% 33%, 98% 36%, 71% 58%, 80% 94%, 50% 75%, 20% 94%, 29% 58%, 2% 36%, 37% 33%); border-radius: 0; }
.pick .dot.drop { border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%; }
.pick .dot.bun { width: 30px; height: 22px; margin-block: 2px; }
.pick[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sounds { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: -4px; scrollbar-width: thin; }
.snd {
  flex: 0 0 auto; font: inherit; font-weight: 800; font-size: 0.78rem; color: var(--ink-soft);
  background: transparent; border: 1.5px dashed var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.snd[aria-pressed="true"] { border-style: solid; border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--line); border-radius: 14px; padding: 3px; gap: 3px; }
.tool {
  font: inherit; font-weight: 800; font-size: 0.85rem; color: var(--ink-soft); background: transparent;
  border: 0; border-radius: 11px; padding: 8px 4px; cursor: pointer;
}
.tool[aria-pressed="true"] { background: var(--bg-2); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.gear {
  font: inherit; font-weight: 800; font-size: 0.85rem; color: var(--ink); background: var(--tray);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.gear[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.panel {
  position: absolute; right: 0; top: 0; z-index: 5; width: min(300px, 100%);
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  display: grid; gap: 12px; box-shadow: 0 12px 32px rgba(40, 10, 25, .18);
}
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; }
.slider { display: grid; grid-template-columns: 78px 1fr 38px; align-items: center; gap: 8px; font-weight: 800; font-size: 0.82rem; }
.slider input { width: 100%; }
.slider output { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; }
.check input { accent-color: var(--accent); width: 18px; height: 18px; }
.lifetime { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
.lifetime b { color: var(--ink); font-weight: 500; }
.keys { font-size: 0.75rem; color: var(--ink-soft); margin: 0; }
.combo {
  position: absolute; right: 4%; top: 10%; font-family: var(--font-display); font-weight: 800;
  font-size: 1.6rem; color: var(--accent); pointer-events: none; opacity: 0; transition: opacity .3s;
  font-variant-numeric: tabular-nums;
}
.combo.show { opacity: 1; }
.combo small { display: block; font-family: var(--font-body); font-size: 0.7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.btn {
  font: inherit; font-weight: 800; font-size: 0.92rem; border-radius: 14px; padding: 11px 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 460px) {
  .actions { grid-template-columns: 1fr 1fr; }
  .btn { padding: 9px 8px; font-size: 0.85rem; }
  .sub { font-size: 0.78rem; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>Crackle <span>Squish</span></h1>
      <p class="sub">Press, hold &amp; drag the squishy, then pick a sound below. Headphones on.</p>
    </div>
    <button class="gear" id="gear" type="button" aria-expanded="false" aria-controls="panel">Mixer</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" tabindex="0" aria-label="Squishy toy. Press and drag to crack it, or press Space."></canvas>
    <div class="hint" id="hint">Tap &amp; hold the squishy</div>
    <div class="toast" id="toast">Shell shattered!</div>
    <div class="combo" id="combo"><small>combo</small><span id="comboN">x3</span></div>
    <div class="panel" id="panel" hidden>
      <h2>Sound mixer</h2>
      <label class="slider" for="vol">Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"><output id="volO">80</output></label>
      <label class="slider" for="mixCrunch">Effects <input id="mixCrunch" type="range" min="0" max="1.5" step="0.01" value="1"><output id="mixCrunchO">100</output></label>
      <label class="slider" for="mixSquish">Squish <input id="mixSquish" type="range" min="0" max="1.5" step="0.01" value="1"><output id="mixSquishO">100</output></label>
      <label class="slider" for="mixRain">Ambience <input id="mixRain" type="range" min="0" max="1" step="0.01" value="0.5"><output id="mixRainO">50</output></label>
      <label class="check" for="vibe"><input id="vibe" type="checkbox" checked> Vibrate on cracks</label>
      <div class="lifetime">
        <span>All-time crunches <b id="lifeCrunch">0</b></span>
        <span>Shells shattered <b id="lifeShatter">0</b></span>
        <span>Best combo <b id="lifeCombo">0</b></span>
      </div>
      <p class="keys">Keyboard: Space crunches, 1–3 switch tools, R re-coats, S shuffles.</p>
    </div>
  </div>

  <div class="tray">
    <div class="stats">
      <span id="shellTxt">Shell 100%</span>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <span id="crunchTxt">0 crunches</span>
    </div>
    <div class="tools" role="group" aria-label="Tool">
      <button class="tool" type="button" data-tool="squeeze" aria-pressed="true">Squeeze</button>
      <button class="tool" type="button" data-tool="poke" aria-pressed="false">Poke</button>
      <button class="tool" type="button" data-tool="smash" aria-pressed="false">Smash</button>
    </div>
    <div class="picks" id="picks" role="group" aria-label="Squishy"></div>
    <div class="sounds" id="sounds" role="group" aria-label="Sound style"></div>
    <div class="actions">
      <button class="btn primary" id="recoat" type="button">Re-coat</button>
      <button class="btn" id="shuffle" type="button">Shuffle</button>
      <button class="btn" id="rain" type="button" aria-pressed="false">Ambience: off</button>
      <button class="btn" id="auto" type="button" aria-pressed="false">Auto ASMR</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- Squishy profiles: look + sound ----------
  const PROFILES = {
    peach: {
      name: "Peach", light: "#ffd9cf", base: "#ff9f8e", dark: "#e5675a",
      shell: "#fff3e6", crackLight: "#fffaf3", crackDark: "#b84a3f", face: "#5b2a2a", blush: "#ff6f7d",
      crack: { fLo: 2200, fHi: 7200, q: 1.4, gap: 0.011, dur: 0.006, gain: 1.6, pop: 0.16, popF: 1300, body: 380 },
      squish: { f: 900, bubbles: 2 }
    },
    cloud: {
      name: "Cloud", light: "#eee6ff", base: "#c6b2ff", dark: "#8f74e6",
      shell: "#ffffff", crackLight: "#ffffff", crackDark: "#6b52c4", face: "#35285e", blush: "#ff8fc3",
      crack: { fLo: 900, fHi: 3800, q: 0.8, gap: 0.007, dur: 0.010, gain: 1.3, pop: 0.05, popF: 700, body: 260 },
      squish: { f: 620, bubbles: 1 }
    },
    honey: {
      name: "Honey", light: "#ffe7a6", base: "#ffc24d", dark: "#e08a12",
      shell: "#fff0c2", crackLight: "#fff9e6", crackDark: "#9b5a05", face: "#4d2c05", blush: "#ff8a5c",
      crack: { fLo: 700, fHi: 2700, q: 3, gap: 0.019, dur: 0.012, gain: 1.7, pop: 0.35, popF: 480, body: 220 },
      squish: { f: 440, bubbles: 5 }, shape: "cube"
    },
    strawberry: {
      name: "Strawberry", light: "#ffc7cf", base: "#ff6b81", dark: "#d93a57",
      shell: "#fff0f2", crackLight: "#fff7f8", crackDark: "#9c1f38", face: "#4f0f1d", blush: "#ffd1d9",
      crack: { fLo: 1800, fHi: 6000, q: 1.8, gap: 0.012, dur: 0.007, gain: 1.6, pop: 0.2, popF: 1000, body: 320 },
      squish: { f: 760, bubbles: 3 }, shape: "drop", pattern: "seeds"
    },
    lemon: {
      name: "Lemon Star", light: "#fffbc2", base: "#ffe34d", dark: "#e6b800",
      shell: "#fffde8", crackLight: "#ffffff", crackDark: "#a07a00", face: "#4a3a00", blush: "#ffa25c",
      crack: { fLo: 2800, fHi: 8800, q: 2.5, gap: 0.009, dur: 0.005, gain: 1.7, pop: 0.18, popF: 1900, body: 450 },
      squish: { f: 1000, bubbles: 2 }, shape: "star", pattern: "sprinkles"
    },
    grape: {
      name: "Grape Gummy", light: "#e3c6ff", base: "#a35cf0", dark: "#6a23b8",
      shell: "#f6ecff", crackLight: "#fbf6ff", crackDark: "#3f0f78", face: "#ffffff", blush: "#ff8fd8",
      crack: { fLo: 600, fHi: 2300, q: 2.2, gap: 0.016, dur: 0.014, gain: 1.8, pop: 0.4, popF: 380, body: 170 },
      squish: { f: 380, bubbles: 6 }
    },
    galaxy: {
      name: "Galaxy", light: "#6f6ad8", base: "#2c2a7a", dark: "#120f3d",
      shell: "#dfe4ff", crackLight: "#ffffff", crackDark: "#05031c", face: "#f4f2ff", blush: "#ff7ad9",
      crack: { fLo: 2500, fHi: 11000, q: 6, gap: 0.013, dur: 0.005, gain: 1.6, pop: 0.25, popF: 3200, body: 200 },
      squish: { f: 700, bubbles: 2 }, pattern: "stars"
    },
    matcha: {
      name: "Matcha Mochi", light: "#e6f5c8", base: "#a9d17a", dark: "#6e9a40",
      shell: "#f6fbe9", crackLight: "#fbfff2", crackDark: "#40621c", face: "#2c3b14", blush: "#ffa3a3",
      crack: { fLo: 700, fHi: 3000, q: 0.7, gap: 0.008, dur: 0.012, gain: 1.4, pop: 0.06, popF: 500, body: 240 },
      squish: { f: 520, bubbles: 1 }, shape: "bun", pattern: "dust"
    },
    mint: {
      name: "Mint Ice", light: "#dcfff4", base: "#93ecd2", dark: "#3fbf9b",
      shell: "#f0fffb", crackLight: "#ffffff", crackDark: "#1f8c70", face: "#14463a", blush: "#ff9db0",
      crack: { fLo: 3600, fHi: 9800, q: 4.5, gap: 0.014, dur: 0.004, gain: 1.6, pop: 0.22, popF: 2600, body: 600 },
      squish: { f: 1100, bubbles: 1 }
    }
  };
  let P = PROFILES.peach;

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");
  const stage = $("stage"), hint = $("hint"), toast = $("toast");
  const shellTxt = $("shellTxt"), crunchTxt = $("crunchTxt"), meter = $("meter");
  const picks = $("picks"), volEl = $("vol"), autoBtn = $("auto");
  const comboEl = $("combo"), comboN = $("comboN");

  for (const [key, p] of Object.entries(PROFILES)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "pick"; b.dataset.key = key;
    b.setAttribute("aria-pressed", key === "peach" ? "true" : "false");
    b.innerHTML = `<span class="dot ${p.shape || ""}" style="background:radial-gradient(circle at 35% 30%, ${p.light}, ${p.base} 60%, ${p.dark})"></span>${p.name}`;
    b.addEventListener("click", () => choose(key));
    picks.appendChild(b);
  }

  // ---------- Saved settings + all-time stats (per browser, optional) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("cs-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("cs-" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const life = store.get("life", { crunch: 0, shatter: 0, combo: 0 });
  const mix = Object.assign({ vol: 0.8, crunch: 1, squish: 1, rain: 0.5, vibe: true }, store.get("mix", {}));

  // ---------- Audio ----------
  let ac = null, master = null, noise = null, crunchBus = null, squishBus = null, rainBus = null;
  let volume = mix.vol;

  function initAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    // master -> compressor -> makeup gain -> brickwall limiter: loud but never clipping
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -24; comp.knee.value = 6; comp.ratio.value = 5; comp.attack.value = 0.001; comp.release.value = 0.08;
    const makeup = ac.createGain(); makeup.gain.value = 2.6;
    const limiter = ac.createDynamicsCompressor();
    limiter.threshold.value = -2; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.0005; limiter.release.value = 0.05;
    master = ac.createGain(); master.gain.value = volume;
    master.connect(comp); comp.connect(makeup); makeup.connect(limiter); limiter.connect(ac.destination);
    crunchBus = ac.createGain(); crunchBus.gain.value = mix.crunch; crunchBus.connect(master);
    squishBus = ac.createGain(); squishBus.gain.value = mix.squish; squishBus.connect(master);
    rainBus = ac.createGain(); rainBus.gain.value = 0; rainBus.connect(master);
    const len = ac.sampleRate * 2;
    noise = ac.createBuffer(1, len, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  // ---------- Sound mixer panel ----------
  const gear = $("gear"), panel = $("panel");
  gear.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
    gear.setAttribute("aria-expanded", String(!panel.hidden));
  });
  document.addEventListener("pointerdown", e => {
    if (!panel.hidden && !panel.contains(e.target) && e.target !== gear) { panel.hidden = true; gear.setAttribute("aria-expanded", "false"); }
  });
  function bindSlider(id, key, apply) {
    const el = $(id), o = $(id + "O");
    el.value = mix[key]; o.textContent = Math.round(mix[key] * 100);
    el.addEventListener("input", () => {
      mix[key] = parseFloat(el.value); o.textContent = Math.round(mix[key] * 100);
      store.set("mix", mix);
      if (ac) apply(mix[key]);
    });
  }
  bindSlider("vol", "vol", v => { volume = v; master.gain.setTargetAtTime(v, ac.currentTime, 0.02); });
  bindSlider("mixCrunch", "crunch", v => crunchBus.gain.setTargetAtTime(v, ac.currentTime, 0.02));
  bindSlider("mixSquish", "squish", v => squishBus.gain.setTargetAtTime(v, ac.currentTime, 0.02));
  bindSlider("mixRain", "rain", v => { if (rainOn) rainBus.gain.setTargetAtTime(v * 0.5, ac.currentTime, 0.1); });
  const vibeEl = $("vibe");
  vibeEl.checked = mix.vibe;
  vibeEl.addEventListener("change", () => { mix.vibe = vibeEl.checked; store.set("mix", mix); });

  function out(pan, bus) {
    bus = bus || crunchBus;
    if (ac.createStereoPanner) {
      const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); p.connect(bus); return p;
    }
    return bus;
  }

  // ---------- Ambience: rain, ocean waves, fireplace ----------
  const AMBS = ["off", "rain", "ocean", "fire"];
  const AMB_LABEL = { off: "Ambience: off", rain: "Rain", ocean: "Ocean", fire: "Fireplace" };
  let amb = "off", ambNodes = [], dropTimer = 0;
  let rainOn = false; // true while any ambience is playing
  const rainBtn = $("rain");
  function loopNoise() { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; s.loopStart = Math.random(); return s; }
  function filt(type, f, q) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; }
  function startAmb(kind) {
    if (!ac) return;
    const t = ac.currentTime;
    if (kind === "rain") {
      const s = loopNoise(), hp = filt("highpass", 250), lp = filt("lowpass", 2200), g = ac.createGain(); g.gain.value = 0.18;
      s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(rainBus); s.start();
      ambNodes.push(s);
    } else if (kind === "ocean") {
      // two slow, out-of-step swells of filtered noise: waves rolling in and out
      for (const [rate, lev, f, pan] of [[0.085, 0.22, 700, -0.5], [0.061, 0.18, 1000, 0.5]]) {
        const s = loopNoise(), lp = filt("lowpass", f, 0.7), g = ac.createGain(); g.gain.value = lev;
        const lfo = ac.createOscillator(); lfo.frequency.value = rate;
        const depth = ac.createGain(); depth.gain.value = lev * 0.95; lfo.connect(depth); depth.connect(g.gain);
        const fl = ac.createGain(); fl.gain.value = f * 0.6; lfo.connect(fl); fl.connect(lp.frequency);
        const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
        s.connect(lp); lp.connect(g);
        if (p) { p.pan.value = pan; g.connect(p); p.connect(rainBus); } else g.connect(rainBus);
        s.start(); lfo.start(t + Math.random() * 3);
        ambNodes.push(s, lfo);
      }
    } else if (kind === "fire") {
      // low roar of the flames; pops and crackles are scheduled in ambTick
      const s = loopNoise(), lp = filt("lowpass", 380, 0.8), g = ac.createGain(); g.gain.value = 0.3;
      s.connect(lp); lp.connect(g); g.connect(rainBus); s.start();
      ambNodes.push(s);
    }
    rainBus.gain.cancelScheduledValues(t);
    rainBus.gain.setTargetAtTime(mix.rain * 0.5, t, 0.6);
  }
  function stopAmb() {
    if (!ac) return;
    rainBus.gain.cancelScheduledValues(ac.currentTime);
    rainBus.gain.setTargetAtTime(0, ac.currentTime, 0.25);
    const old = ambNodes; ambNodes = [];
    setTimeout(() => old.forEach(n => { try { n.stop(); } catch (e) {} }), 1200);
  }
  function ambOut() {
    if (!ac.createStereoPanner) return rainBus;
    const p = ac.createStereoPanner(); p.pan.value = Math.random() * 2 - 1; p.connect(rainBus); return p;
  }
  function rainDrops(dt) {
    if (!rainOn || !ac || ambNodes.length === 0) return;
    dropTimer -= dt;
    while (dropTimer <= 0) {
      const t = ac.currentTime + Math.random() * 0.02;
      if (amb === "rain") {
        dropTimer += 0.02 + Math.random() * 0.12;
        tick(t, 1200 + Math.random() * 4000, 2, 0.08 + Math.random() * 0.25, 0.01 + Math.random() * 0.02, ambOut());
      } else if (amb === "fire") {
        dropTimer += 0.04 + Math.random() * 0.35;
        const dest = ambOut();
        const n = Math.random() < 0.15 ? 4 + ((Math.random() * 6) | 0) : 1; // the odd burst of sparks
        for (let i = 0; i < n; i++) tick(t + i * (0.008 + Math.random() * 0.03), 1200 + Math.random() * 3500, 1.2, 0.15 + Math.random() * 0.45, 0.006 + Math.random() * 0.015, dest);
        if (Math.random() < 0.08) tick(t, 300 + Math.random() * 300, 1, 0.6, 0.05, dest); // a log settling
      } else {
        dropTimer += 0.5;
      }
    }
  }
  rainBtn.addEventListener("click", () => {
    initAudio();
    stopAmb();
    amb = AMBS[(AMBS.indexOf(amb) + 1) % AMBS.length];
    rainOn = amb !== "off";
    rainBtn.setAttribute("aria-pressed", String(rainOn));
    rainBtn.textContent = AMB_LABEL[amb];
    if (rainOn) startAmb(amb);
  });

  // one crisp fracture tick: broadband noise with a resonant colour (not a thin bandpass,
  // so it keeps the sharp "edge" a real crack has)
  function tick(t, freq, q, gain, dur, dest) {
    const src = ac.createBufferSource(); src.buffer = noise;
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = Math.min(freq * 0.35, 2500);
    const pk = ac.createBiquadFilter(); pk.type = "peaking"; pk.frequency.value = freq; pk.Q.value = q; pk.gain.value = 12;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.0004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(hp); hp.connect(pk); pk.connect(g); g.connect(dest);
    src.start(t, Math.random() * 1.8, dur + 0.03);
  }

  // the moment the shell first breaks: a hard snap plus a low knock through the jelly
  function snap(t, intensity, dest) {
    tick(t, 3500, 0.7, intensity * 1.6, 0.005, dest);
    tick(t + 0.002, 1800, 1, intensity * 1.1, 0.009, dest);
    const src = ac.createBufferSource(); src.buffer = noise;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = P.crack.body; lp.Q.value = 2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(intensity * 1.4, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    src.connect(lp); lp.connect(g); g.connect(dest);
    src.start(t, Math.random(), 0.1);
  }

  // a fracture running through the shell: one snap, then crackles that thin out
  // as the crack travels (gaps grow, a few loud ticks among many quiet ones)
  function crackle(count, intensity, pan, delay = 0, withSnap = false) {
    if (!ac || count <= 0) return;
    const c = P.crack, dest = out(pan);
    let t = ac.currentTime + 0.005 + delay;
    if (withSnap) { snap(t, intensity, dest); t += 0.006; }
    let gap = c.gap * 0.35;
    for (let i = 0; i < count; i++) {
      t += gap * (0.4 + Math.random() * 1.2) + (Math.random() < 0.08 ? c.gap * 4 : 0);
      gap *= 1.07;
      const fade = 1 - (i / count) * 0.65;
      let g = intensity * c.gain * fade * (0.12 + 0.88 * Math.pow(Math.random(), 2.2));
      if (Math.random() < 0.1) g *= 1.8;
      tick(t, c.fLo + Math.random() * (c.fHi - c.fLo), c.q, g, c.dur * (0.6 + Math.random() * 0.9), dest);
      if (Math.random() < c.pop) tick(t + 0.001, c.popF * (0.7 + Math.random() * 0.6), 1.5, g * 1.5, c.dur * 4, dest);
    }
  }

  // wet squelch + bubbles: the jelly inside
  function squish(amount, pan, release = false) {
    if (!ac) return;
    const s = P.squish, dest = out(pan, squishBus), t = ac.currentTime + 0.003;
    const src = ac.createBufferSource(); src.buffer = noise;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 6;
    const f0 = s.f * (release ? 0.7 : 1.5), f1 = s.f * (release ? 1.2 : 0.35);
    lp.frequency.setValueAtTime(f0, t);
    lp.frequency.exponentialRampToValueAtTime(f1, t + 0.32);
    const g = ac.createGain();
    const peak = amount * (release ? 0.35 : 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    src.connect(lp); lp.connect(g); g.connect(dest);
    src.start(t, Math.random(), 0.5);
    const n = release ? Math.ceil(s.bubbles / 2) : s.bubbles;
    for (let i = 0; i < n; i++) bubble(t + 0.03 + Math.random() * 0.25, s.f * (0.4 + Math.random() * 0.6), amount * 0.12, dest);
  }
  function bubble(t, f, gain, dest) {
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.9, t + 0.045);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.08);
  }
  // glossy pour for re-coating
  function pour() {
    if (!ac) return;
    const t = ac.currentTime, dest = out(0, master);
    const src = ac.createBufferSource(); src.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 3;
    bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(2400, t + 0.7);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.3, t + 0.1); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
    src.connect(bp); bp.connect(g); g.connect(dest); src.start(t, 0, 1);
    for (let i = 0; i < 6; i++) bubble(t + 0.1 + i * 0.09, 500 + i * 90, 0.06, dest);
  }

  // ---------- Sound styles ----------
  // Each style answers three moments: press (with how much shell broke), drag steps and release.
  // ctx object: { pan, n (crack segments made), shell (0-1 shell left), had (shell existed), power, count }
  const R1 = (a, b) => a + Math.random() * (b - a);

  function tone(t, f, type, gain, attack, decay, dest, f2) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + decay);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + attack + decay + 0.05);
  }
  function burst(t, type, f, q, gain, dur, dest, f2) {
    const s = ac.createBufferSource(); s.buffer = noise;
    const b = ac.createBiquadFilter(); b.type = type; b.frequency.setValueAtTime(f, t); b.Q.value = q;
    if (f2) b.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + Math.min(0.004, dur / 4));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(b); b.connect(g); g.connect(dest); s.start(t, Math.random() * 1.5, dur + 0.05);
  }

  // slime: wet clicks and air pockets popping
  function slimeClicks(t, n, gain, dest) {
    for (let i = 0; i < n; i++) {
      t += R1(0.01, 0.06);
      burst(t, "bandpass", R1(500, 1800), R1(3, 8), gain * R1(0.3, 1), R1(0.008, 0.02), dest);
      if (Math.random() < 0.35) tone(t, R1(250, 600), "sine", gain * 0.35, 0.002, 0.04, dest, R1(700, 1200));
    }
  }
  // bubble wrap: a sharp air pop with a little plastic ring
  function wrapPop(t, gain, dest) {
    burst(t, "highpass", 900, 0.7, gain * 1.2, 0.02, dest);
    burst(t, "bandpass", R1(1400, 2600), 2.5, gain, 0.035, dest);
    tone(t, R1(180, 260), "sine", gain * 0.5, 0.001, 0.03, dest, 90);
  }
  // squeaky foam: rubbery friction, a pitched squeak that wobbles
  function squeak(t, gain, dur, dest) {
    const o = ac.createOscillator(); o.type = "sawtooth";
    const f = R1(500, 1300);
    o.frequency.setValueAtTime(f, t);
    o.frequency.linearRampToValueAtTime(f * R1(0.8, 1.35), t + dur);
    const wob = ac.createOscillator(); wob.frequency.value = R1(25, 45);
    const wg = ac.createGain(); wg.gain.value = f * 0.04; wob.connect(wg); wg.connect(o.frequency);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 3;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.015);
    g.gain.setValueAtTime(gain * 0.8, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(bp); bp.connect(g); g.connect(dest);
    o.start(t); wob.start(t); o.stop(t + dur + 0.02); wob.stop(t + dur + 0.02);
  }
  // crinkle: plastic wrapper, dense irregular crackle with longer grains
  function crinkle(t, n, gain, dest) {
    for (let i = 0; i < n; i++) {
      t += Math.random() < 0.2 ? R1(0.03, 0.07) : R1(0.003, 0.018);
      burst(t, "bandpass", R1(2000, 9000), R1(0.6, 1.5), gain * Math.pow(Math.random(), 1.5), R1(0.01, 0.03), dest);
    }
  }
  // popping candy: a fizz that keeps going after you let go
  function fizz(t, n, len, gain, dest) {
    burst(t, "highpass", 5000, 0.7, gain * 0.35, len, dest);
    for (let i = 0; i < n; i++) {
      const k = Math.pow(Math.random(), 1.8); // denser at the start
      tick(t + k * len, R1(3000, 10000), 3, gain * (1 - k) * R1(0.3, 1), R1(0.002, 0.006), dest);
    }
  }
  // tapping: fingernails on a hard candy shell
  function tap(t, gain, dest) {
    const f = R1(1100, 2200);
    tone(t, f, "triangle", gain, 0.001, 0.035, dest);
    tone(t, f * 2.3, "sine", gain * 0.4, 0.001, 0.02, dest);
    burst(t, "highpass", 3000, 0.7, gain * 0.6, 0.006, dest);
  }
  function scratch(t, dur, gain, dest) {
    const n = Math.round(dur / 0.012);
    for (let i = 0; i < n; i++) burst(t + i * R1(0.008, 0.014), "bandpass", R1(2500, 5000), 2, gain * R1(0.3, 1), 0.012, dest);
  }
  // glass chime: bell-like tinkles on a pentatonic scale, so it always sounds pretty
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  function chime(t, gain, dest) {
    const f = 1046.5 * Math.pow(2, PENTA[(Math.random() * PENTA.length) | 0] / 12);
    const d = R1(0.6, 1.3);
    tone(t, f, "sine", gain, 0.002, d, dest);
    tone(t, f * 2.76, "sine", gain * 0.35, 0.002, d * 0.5, dest);
    tone(t, f * 5.4, "sine", gain * 0.15, 0.002, d * 0.25, dest);
  }

  const VOICES = {
    crack: {
      name: "Crack",
      press: c => crackle(Math.round((10 + c.n * 0.9) * (0.25 + c.shell) * c.count), (0.45 + 0.55 * c.shell) * c.power, c.pan, 0, c.had),
      drag: c => crackle(Math.round((4 + c.n * 1.5) * (0.2 + c.shell)), 0.35 + 0.55 * c.shell, c.pan),
      release: c => { if (c.had) crackle(2 + ((Math.random() * 4) | 0), 0.25, c.pan, 0.06 + Math.random() * 0.1); }
    },
    slime: {
      name: "Slime",
      press: c => { const d = out(c.pan); slimeClicks(ac.currentTime, Math.round(6 + 6 * c.power), 0.9, d); squish(0.9 * c.power, c.pan); },
      drag: c => { slimeClicks(ac.currentTime, 2 + ((Math.random() * 3) | 0), 0.7, out(c.pan)); if (Math.random() < 0.4) squish(0.35, c.pan); },
      release: c => { const d = out(c.pan), t = ac.currentTime; tone(t + 0.02, R1(200, 320), "sine", 0.5, 0.003, 0.08, d, R1(700, 1000)); slimeClicks(t + 0.04, 3, 0.5, d); }
    },
    wrap: {
      name: "Bubble wrap",
      press: c => { const d = out(c.pan); let t = ac.currentTime; const n = Math.round(1 + c.power * 2.5); for (let i = 0; i < n; i++) { wrapPop(t, R1(0.7, 1.1), d); t += R1(0.03, 0.12); } },
      drag: c => { if (Math.random() < 0.55) wrapPop(ac.currentTime + R1(0, 0.03), R1(0.5, 0.9), out(c.pan)); },
      release: c => {}
    },
    squeak: {
      name: "Squeaky foam",
      press: c => { const d = out(c.pan), t = ac.currentTime; squeak(t, 0.5, R1(0.12, 0.25), d); tone(t, 140, "sine", 0.6 * c.power, 0.004, 0.12, d, 70); },
      drag: c => squeak(ac.currentTime, 0.35, R1(0.06, 0.13), out(c.pan)),
      release: c => squeak(ac.currentTime + 0.02, 0.25, 0.1, out(c.pan))
    },
    crinkle: {
      name: "Crinkle",
      press: c => crinkle(ac.currentTime, Math.round(25 + 20 * c.power), 0.9, out(c.pan)),
      drag: c => crinkle(ac.currentTime, 8, 0.7, out(c.pan)),
      release: c => crinkle(ac.currentTime + 0.05, 10, 0.4, out(c.pan))
    },
    fizz: {
      name: "Popping candy",
      press: c => { fizz(ac.currentTime, Math.round(50 + 50 * c.power), 1.2 + c.power, 0.8, out(c.pan)); squish(0.3, c.pan); },
      drag: c => fizz(ac.currentTime, 12, 0.5, 0.6, out(c.pan)),
      release: c => {}
    },
    tap: {
      name: "Tapping",
      press: c => { const d = out(c.pan); let t = ac.currentTime; const n = 2 + ((Math.random() * 3) | 0); for (let i = 0; i < n; i++) { tap(t, R1(0.6, 1) * c.power, d); t += R1(0.05, 0.09); } },
      drag: c => scratch(ac.currentTime, 0.07, 0.5, out(c.pan)),
      release: c => tap(ac.currentTime + 0.03, 0.4, out(c.pan))
    },
    chime: {
      name: "Glass chime",
      press: c => { const d = out(c.pan); let t = ac.currentTime; const n = 2 + ((Math.random() * 2) | 0); for (let i = 0; i < n; i++) { chime(t, 0.35, d); t += R1(0.05, 0.15); } tick(ac.currentTime, 6000, 3, 0.5, 0.004, d); },
      drag: c => { if (Math.random() < 0.5) chime(ac.currentTime, 0.22, out(c.pan)); },
      release: c => {}
    },
    mix: { name: "Mix" }
  };
  const MIXABLE = Object.keys(VOICES).filter(k => k !== "mix");
  let soundMode = store.get("sound", "crack");
  if (!VOICES[soundMode]) soundMode = "crack";
  let pressVoice = "crack";
  const voice = () => VOICES[soundMode === "mix" ? pressVoice : soundMode];

  const soundsEl = $("sounds");
  for (const [key, v] of Object.entries(VOICES)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "snd"; b.dataset.key = key; b.textContent = v.name;
    b.setAttribute("aria-pressed", String(key === soundMode));
    b.addEventListener("click", () => {
      initAudio();
      soundMode = key; store.set("sound", key);
      for (const x of soundsEl.children) x.setAttribute("aria-pressed", String(x.dataset.key === key));
      // play a little preview
      pressVoice = key === "mix" ? MIXABLE[(Math.random() * MIXABLE.length) | 0] : key;
      voice().press({ pan: 0, n: 8, shell: 1, had: true, power: 0.8, count: 0.6 });
    });
    soundsEl.appendChild(b);
  }

  const buzz = p => { if (!mix.vibe) return; try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ---------- Shapes: rest radius as a function of angle ----------
  function shapeR(a, shape) {
    const c = Math.cos(a), s = Math.sin(a);
    switch (shape) {
      case "cube": return 0.9 * Math.pow(Math.pow(Math.abs(c), 4) + Math.pow(Math.abs(s), 4), -0.25);
      case "star": return 0.9 + 0.14 * Math.cos(5 * (a + Math.PI / 2));
      case "drop": return 0.97 - 0.13 * s;
      case "bun": return 1 / Math.sqrt((c * c) / (1.14 * 1.14) + (s * s) / (0.86 * 0.86));
      default: return 1;
    }
  }

  // ---------- Soft body ----------
  const N = 72;
  const off = new Float32Array(N), vel = new Float32Array(N);
  const rest = new Float32Array(N);
  function buildShape() { for (let i = 0; i < N; i++) rest[i] = shapeR((i / N) * Math.PI * 2, P.shape); }
  buildShape();

  // Surface patterns (seeds, sprinkles, stars, powder), placed in local squishy space.
  let deco = [];
  function buildDeco() {
    deco = [];
    const kind = P.pattern;
    if (!kind) return;
    const count = { seeds: 26, sprinkles: 34, stars: 46, dust: 70 }[kind];
    const cols = ["#ff5fa2", "#5cc8ff", "#7be07b", "#ffffff", "#ff9a3d", "#b07cff"];
    let guard = 0;
    while (deco.length < count && guard++ < 2000) {
      const x = (Math.random() * 2 - 1) * 0.92, y = (Math.random() * 2 - 1) * 0.92;
      const r = Math.hypot(x, y), a = Math.atan2(y, x);
      if (r > shapeR(a, P.shape) * 0.86) continue;
      if (kind !== "stars" && kind !== "dust" && Math.abs(y) < 0.3 && Math.abs(x) < 0.55) continue; // keep the face clear
      deco.push({ x, y, rot: Math.random() * Math.PI, ph: Math.random() * 6.28, s: 0.5 + Math.random() * 0.8, col: cols[(Math.random() * cols.length) | 0] });
    }
  }
  buildDeco();
  let squash = 0, squashV = 0;
  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, R = 100;
  let sx = 1, sy = 1;

  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    cx = W / 2; cy = H * 0.5;
    R = Math.max(60, Math.min(W * 0.36, H * 0.36));
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- Shell state ----------
  let integrity = 1, cracks = [], facets = [], chips = [], crunches = 0, shattered = false;
  const particles = [];

  // ---------- Interaction ----------
  const press = { on: false, virtual: false, x: 0, y: 0, amt: 0, moved: 0, lastX: 0, lastY: 0, id: null };

  function toLocal(x, y) { return [(x - cx) / (R * sx), (y - cy) / (R * sy)]; }
  function panOf(x) { return ((x - cx) / (W / 2)) * 0.8; }

  // Crack widths are bucketed so drawing can batch them.
  const WB = [0.5, 0.8, 1.2, 1.7, 2.3];
  const bucket = w => WB.reduce((b, v) => Math.abs(v - w) < Math.abs(b - w) ? v : b, WB[0]);
  const TAU = Math.PI * 2;
  const inside = (x, y) => Math.hypot(x, y) < shapeR(Math.atan2(y, x), P.shape);

  function seg(x1, y1, x2, y2, w) { cracks.push({ x1, y1, x2, y2, w: bucket(w) }); }

  // A mostly straight crack with small kinks that tapers to a hairline tip.
  function runCrack(x, y, ang, len, w0, hits, depth) {
    const pts = [[x, y]];
    let d = 0;
    while (d < len) {
      const L = 0.03 + Math.random() * 0.035;
      ang += (Math.random() - 0.5) * 0.32;
      const nx = x + Math.cos(ang) * L, ny = y + Math.sin(ang) * L;
      if (!inside(nx, ny)) break;
      const taper = 1 - d / len;
      seg(x, y, nx, ny, 0.5 + (w0 - 0.5) * taper);
      hits.push([nx, ny]);
      x = nx; y = ny; d += L; pts.push([x, y]);
      // side branches fork off at 25-50 degrees and stay thinner
      if (depth < 1 && d > 0.1 && Math.random() < 0.07) {
        const side = Math.random() < 0.5 ? 1 : -1;
        runCrack(x, y, ang + side * (0.45 + Math.random() * 0.45), (len - d) * (0.35 + Math.random() * 0.4), Math.max(0.6, w0 * taper * 0.6), hits, depth + 1);
      }
    }
    return pts;
  }
  const along = (pts, f) => pts.length > 2 ? pts[Math.min(pts.length - 1, Math.max(1, Math.round(f * (pts.length - 1))))] : null;

  // A jagged connecting crack between two points (the rings of a spiderweb fracture).
  function jag(a, b, w, hits) {
    const n = 3, dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    const px = -dy / len, py = dx / len;
    let prev = a;
    for (let i = 1; i <= n; i++) {
      const k = i / n, j = i < n ? (Math.random() - 0.5) * len * 0.25 : 0;
      const p = [a[0] + dx * k + px * j, a[1] + dy * k + py * j];
      seg(prev[0], prev[1], p[0], p[1], w); hits.push(p); prev = p;
    }
  }

  // Impact fracture: radial cracks from the press point, joined by 1-2 rings,
  // with the shard facets between them catching the light differently.
  function impactCrack(lx, ly, power) {
    if (integrity <= 0) return [];
    const hits = [[lx, ly]];
    const n = 4 + Math.round(Math.random() * 2 + power * 2);
    const base = Math.random() * TAU;
    const radials = [];
    for (let i = 0; i < n; i++) {
      const a = base + (i / n) * TAU + (Math.random() - 0.5) * (TAU / n) * 0.55;
      const len = (0.22 + power * 0.32) * (0.55 + Math.random() * 0.7);
      radials.push(runCrack(lx, ly, a, len, 1.4 + power * 0.9, hits, 0));
    }
    const rings = power > 0.75 ? [0.35, 0.75] : [0.45 + Math.random() * 0.2];
    const ringPts = rings.map(f => radials.map(r => along(r, f)));
    ringPts.forEach((ring, k) => {
      for (let i = 0; i < n; i++) {
        const a = ring[i], b = ring[(i + 1) % n];
        if (a && b && Math.random() < 0.8) jag(a, b, k === 0 ? 0.9 : 0.6, hits);
      }
    });
    // facets: wedges between neighbouring radials
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const a1 = ringPts[0][i], b1 = ringPts[0][j];
      if (a1 && b1) facets.push({ pts: [[lx, ly], a1, b1], s: (Math.random() - 0.5) * 0.5 });
      if (ringPts[1]) {
        const a2 = ringPts[1][i], b2 = ringPts[1][j];
        if (a1 && b1 && a2 && b2) facets.push({ pts: [a1, a2, b2, b1], s: (Math.random() - 0.5) * 0.42 });
      }
    }
    // crushed centre: a small chip where the shell flaked off
    if (Math.random() < 0.35 + power * 0.4) {
      const r = 0.025 + Math.random() * 0.035 * power, pts = [];
      for (let k = 0; k < 6; k++) { const a = (k / 6) * TAU + Math.random() * 0.6; const rr = r * (0.6 + Math.random() * 0.6); pts.push([lx + Math.cos(a) * rr, ly + Math.sin(a) * rr]); }
      chips.push(pts);
    }
    trimCracks();
    return hits;
  }

  // Dragging drags a single crack along behind the finger, with small forks.
  function dragCrack(ax, ay, bx, by) {
    if (integrity <= 0 || !inside(ax, ay) || !inside(bx, by)) return [];
    const hits = [];
    jag([ax, ay], [bx, by], 1.2, hits);
    if (Math.random() < 0.35) {
      const ang = Math.atan2(by - ay, bx - ax) + (Math.random() < 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.5);
      runCrack(bx, by, ang, 0.05 + Math.random() * 0.1, 0.8, hits, 2);
    }
    trimCracks();
    return hits;
  }
  function trimCracks() {
    if (cracks.length > 2600) cracks.splice(0, cracks.length - 2600);
    if (facets.length > 500) facets.splice(0, facets.length - 500);
    if (chips.length > 120) chips.splice(0, chips.length - 120);
  }

  function spawnCrumbs(hits, n) {
    for (let i = 0; i < n && hits.length; i++) {
      const [lx, ly] = hits[(Math.random() * hits.length) | 0];
      const x = cx + lx * R * sx, y = cy + ly * R * sy;
      const ang = Math.atan2(ly, lx) + (Math.random() - 0.5);
      const sp = 60 + Math.random() * 160;
      particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 80, r: 1.5 + Math.random() * 2.5, life: 0.8 + Math.random() * 0.6, t: 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, shard: false });
    }
  }
  function spawnShards(n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * 0.95;
      const x = cx + Math.cos(a) * rr * R * sx, y = cy + Math.sin(a) * rr * R * sy;
      particles.push({ x, y, vx: Math.cos(a) * (40 + Math.random() * 120), vy: -60 - Math.random() * 120, r: 5 + Math.random() * 9, life: 1.2 + Math.random() * 0.8, t: 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8, shard: true });
    }
  }

  function setIntegrity(v) {
    const before = integrity;
    integrity = Math.max(0, v);
    // flakes fall off as the shell weakens
    if (Math.floor(before * 4) > Math.floor(integrity * 4)) spawnShards(6);
    if (integrity <= 0 && !shattered) {
      shattered = true;
      life.shatter++; store.set("life", life);
      spawnShards(26);
      shake = Math.max(shake, 10);
      if (voice() === VOICES.crack) crackle(60, 1, 0, 0.02);
      else voice().press({ pan: 0, n: 30, shell: 1, had: true, power: 1.4, count: 2 });
      buzz([30, 30, 20, 40, 15]);
      showToast("Shell shattered!");
    }
    updateUI();
  }

  // ---------- Tools ----------
  // squeeze: the classic press. poke: a fingertip prod, small crisp cracks.
  // smash: a heavy hit, big fractures, a deep knock and a little screen shake.
  const TOOLS = {
    squeeze: { power: [0.5, 1.0], depth: 1,    squash: 0.2,  loss: 0.06, crumbs: 10, snap: 1,   count: 1,   squish: 1 },
    poke:    { power: [0.15, 0.3], depth: 1.6, squash: 0.06, loss: 0.02, crumbs: 4,  snap: 0.7, count: 0.5, squish: 0.4 },
    smash:   { power: [1.1, 1.4], depth: 1.3, squash: 0.34, loss: 0.16, crumbs: 26, snap: 1.5, count: 1.8, squish: 1.3 }
  };
  let tool = "squeeze";
  const toolBtns = [...document.querySelectorAll(".tool")];
  function setTool(t) {
    tool = t;
    for (const b of toolBtns) b.setAttribute("aria-pressed", String(b.dataset.tool === t));
  }
  toolBtns.forEach(b => b.addEventListener("click", () => setTool(b.dataset.tool)));

  // ---------- Combo: crunches in quick succession ----------
  let combo = 0, lastCrunchAt = -9, comboHide = 0;
  function bumpCombo() {
    combo = time - lastCrunchAt < 0.75 ? combo + 1 : 1;
    lastCrunchAt = time;
    if (combo >= 3) {
      comboN.textContent = "x" + combo;
      comboEl.classList.add("show");
      comboEl.animate && comboEl.animate([{ transform: "scale(1.25)" }, { transform: "scale(1)" }], { duration: 180 });
      comboHide = 1.1;
      if (combo > life.combo) { life.combo = combo; store.set("life", life); }
    }
  }

  let shake = 0;
  function startPress(x, y, virtual) {
    const [lx, ly] = toLocal(x, y);
    if (Math.hypot(lx, ly) > shapeR(Math.atan2(ly, lx), P.shape) * 1.12) return false;
    const T = TOOLS[tool];
    Object.assign(press, { on: true, virtual, x, y, lastX: x, lastY: y, moved: 0, tool: T });
    canvas.classList.add("pressing");
    hint.classList.add("gone");
    const had = integrity > 0;
    const power = T.power[0] + Math.random() * (T.power[1] - T.power[0]);
    let hits = impactCrack(lx, ly, Math.min(1, power));
    if (tool === "smash" && had) hits = hits.concat(impactCrack(lx + (Math.random() - 0.5) * 0.3, ly + (Math.random() - 0.5) * 0.3, 0.8));
    press.lx = lx; press.ly = ly;
    const shellAmt = Math.min(1, integrity * 1.4);
    pressVoice = MIXABLE[(Math.random() * MIXABLE.length) | 0];
    voice().press({ pan: panOf(x), n: hits.length, shell: shellAmt, had, power: T.snap, count: T.count });
    if (voice() === VOICES.crack) squish((0.5 + 0.5 * (1 - shellAmt)) * T.squish, panOf(x));
    else squish(0.35 * T.squish, panOf(x));
    spawnCrumbs(hits, had ? T.crumbs : 0);
    if (tool === "smash") { shake = 7; squashV += 3; }
    if (had) {
      crunches++; life.crunch++; store.set("life", life); bumpCombo();
      buzz(tool === "smash" ? [40, 20, 25, 30, 15] : tool === "poke" ? [6] : [12, 18, 8, 25, 10]);
    } else buzz(15);
    setIntegrity(integrity - T.loss * (0.75 + Math.random() * 0.5));
    return true;
  }
  function movePress(x, y) {
    if (!press.on) return;
    const dx = x - press.lastX, dy = y - press.lastY;
    press.moved += Math.hypot(dx, dy);
    press.lastX = x; press.lastY = y; press.x = x; press.y = y;
    while (press.moved > 16) {
      press.moved -= 16;
      const [lx, ly] = toLocal(x, y);
      if (lx * lx + ly * ly > 1.2) continue;
      const hits = dragCrack(press.lx, press.ly, lx, ly);
      press.lx = lx; press.ly = ly;
      const shellAmt = Math.min(1, integrity * 1.4);
      voice().drag({ pan: panOf(x), n: hits.length, shell: shellAmt, had: integrity > 0, power: 1, count: 1 });
      if (Math.random() < 0.25) squish(0.25, panOf(x));
      spawnCrumbs(hits, integrity > 0 ? 3 : 0);
      if (integrity > 0) buzz(6);
      setIntegrity(integrity - 0.007);
    }
  }
  function endPress() {
    if (!press.on) return;
    press.on = false;
    canvas.classList.remove("pressing");
    squish(0.5, panOf(press.x), true);
    // little settling crackles after letting go
    voice().release({ pan: panOf(press.x), n: 0, shell: integrity, had: integrity > 0, power: 1, count: 1 });
    squashV -= 2.5; // bounce back
  }

  canvas.addEventListener("pointerdown", e => {
    initAudio();
    if (startPress(e.offsetX, e.offsetY, false)) {
      press.id = e.pointerId;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener("pointermove", e => { if (press.on && !press.virtual && e.pointerId === press.id) movePress(e.offsetX, e.offsetY); });
  const up = e => { if (press.on && !press.virtual && e.pointerId === press.id) endPress(); };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);

  // ---------- Auto ASMR ----------
  let auto = false, autoT = 0.6, autoPlan = null;
  autoBtn.addEventListener("click", () => {
    initAudio();
    auto = !auto;
    autoBtn.setAttribute("aria-pressed", String(auto));
    autoBtn.textContent = auto ? "Auto ASMR on" : "Auto ASMR";
    autoT = 0.3;
    if (!auto && press.virtual) { endPress(); autoPlan = null; }
  });
  function runAuto(dt) {
    if (!auto) return;
    if (press.on && !press.virtual) return;
    if (autoPlan) {
      autoPlan.t += dt;
      const k = Math.min(1, autoPlan.t / autoPlan.dur);
      const x = autoPlan.x0 + (autoPlan.x1 - autoPlan.x0) * k, y = autoPlan.y0 + (autoPlan.y1 - autoPlan.y0) * k;
      movePress(x, y);
      if (k >= 1) { endPress(); autoPlan = null; autoT = 0.5 + Math.random() * 1.4; }

    }
    autoT -= dt;
    if (autoT <= 0) {
      if (integrity <= 0 && Math.random() < 0.5) { recoat(); autoT = 1.2; return; }
      const a = Math.random() * Math.PI * 2, r = Math.random() * 0.6;
      const x0 = cx + Math.cos(a) * r * R, y0 = cy + Math.sin(a) * r * R;
      const b = a + Math.PI + (Math.random() - 0.5);
      const drag = Math.random() < 0.6 ? R * (0.2 + Math.random() * 0.5) : 0;
      const x1 = x0 + Math.cos(b) * drag, y1 = y0 + Math.sin(b) * drag;
      if (startPress(x0, y0, true)) autoPlan = { x0, y0, x1, y1, t: 0, dur: 0.35 + Math.random() * 0.7 };
      else autoT = 0.2;
    }
  }

  // ---------- Controls ----------
  function recoat() {
    initAudio();
    integrity = 1; cracks = []; facets = []; chips = []; shattered = false;
    gloss = 1;
    pour();
    squashV -= 1.5;
    updateUI();
  }
  $("recoat").addEventListener("click", recoat);

  let current = "peach";
  function choose(key) {
    current = key;
    P = PROFILES[key];
    buildShape(); buildDeco();
    for (const b of picks.children) {
      const on = b.dataset.key === key;
      b.setAttribute("aria-pressed", String(on));
      if (on) b.scrollIntoView({ block: "nearest", inline: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    }
    recoat();
    crunches = 0; combo = 0; updateUI();
  }
  function shuffle() {
    const keys = Object.keys(PROFILES).filter(k => k !== current);
    choose(keys[(Math.random() * keys.length) | 0]);
    showToast(P.name + "!");
  }
  $("shuffle").addEventListener("click", shuffle);

  // ---------- Keyboard ----------
  let keyHeld = false;
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, .panel")) return;
    const k = e.key.toLowerCase();
    if ((k === " " || k === "enter") && document.activeElement === canvas || k === " " && document.activeElement === document.body) {
      e.preventDefault();
      if (keyHeld) return;
      keyHeld = true; initAudio();
      const a = Math.random() * Math.PI * 2, r = Math.random() * 0.6;
      startPress(cx + Math.cos(a) * r * R, cy + Math.sin(a) * r * R, true);
    } else if (k === "1" || k === "2" || k === "3") setTool(["squeeze", "poke", "smash"][+k - 1]);
    else if (k === "r") recoat();
    else if (k === "s") { initAudio(); shuffle(); }
  });
  document.addEventListener("keyup", e => {
    if (keyHeld && (e.key === " " || e.key === "Enter")) { keyHeld = false; if (press.on && press.virtual && !autoPlan) endPress(); }
  });

  let toastTimer = 0;
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
  }
  function updateUI() {
    const pct = Math.round(integrity * 100);
    shellTxt.textContent = `Shell ${pct}%`;
    meter.style.width = pct + "%";
    crunchTxt.textContent = `${crunches} crunch${crunches === 1 ? "" : "es"}`;
    $("lifeCrunch").textContent = life.crunch.toLocaleString();
    $("lifeShatter").textContent = life.shatter.toLocaleString();
    $("lifeCombo").textContent = "x" + life.combo;
  }

  // ---------- Render ----------
  let gloss = 0; // shimmer after re-coat
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  updateUI();

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }

  function blobPath() {
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const rr = R * rest[i] * (1 + off[i]);
      pts.push([cx + Math.cos(a) * rr * sx, cy + Math.sin(a) * rr * sy]);
    }
    const p = new Path2D();
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let m = mid(pts[N - 1], pts[0]);
    p.moveTo(m[0], m[1]);
    for (let i = 0; i < N; i++) {
      const nxt = pts[(i + 1) % N], mm = mid(pts[i], nxt);
      p.quadraticCurveTo(pts[i][0], pts[i][1], mm[0], mm[1]);
    }
    p.closePath();
    return p;
  }

  let last = performance.now(), time = 0;
  function frame(now) {
    let dt = Math.min(0.033, (now - last) / 1000); last = now; time += dt;
    runAuto(dt);
    rainDrops(dt);
    if (comboHide > 0) { comboHide -= dt; if (comboHide <= 0) comboEl.classList.remove("show"); }

    // physics (two substeps for stability)
    for (let sub = 0; sub < 2; sub++) {
      const h = dt / 2;
      press.amt += ((press.on ? 1 : 0) - press.amt) * Math.min(1, h * (press.on ? 9 : 30));
      const T = press.tool || TOOLS.squeeze;
      const target = press.amt * T.squash;
      squashV += (-260 * (squash - target) - 11 * squashV) * h;
      squash += squashV * h;
      let pa = 0, pd = 0;
      if (press.on) {
        const [lx, ly] = toLocal(press.x, press.y);
        pa = Math.atan2(ly, lx); pd = Math.min(1, Math.hypot(lx, ly));
      }
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        let d = a - pa; d = Math.atan2(Math.sin(d), Math.cos(d));
        const idle = reduceMotion ? 0 : 0.008 * Math.sin(time * 2.2 + a * 3);
        const tgt = idle + press.amt * (-0.16 * T.depth * pd * Math.exp(-(d * d) / 0.22) + 0.04);
        const lap = off[(i + N - 1) % N] + off[(i + 1) % N] - 2 * off[i];
        vel[i] += (-200 * (off[i] - tgt) - 9 * vel[i] + 900 * lap) * h;
      }
      for (let i = 0; i < N; i++) off[i] += vel[i] * h;
    }
    sx = 1 + squash * 0.55; sy = 1 - squash;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (shake > 0.1 && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= Math.pow(0.002, dt);

    // ground shadow
    const shY = cy + R * sy * 1.02 + 6;
    const sg = ctx.createRadialGradient(cx, shY, 0, cx, shY, R * sx);
    sg.addColorStop(0, "rgba(40,10,25,0.22)"); sg.addColorStop(1, "rgba(40,10,25,0)");
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.ellipse(cx, shY, R * sx * 1.0, R * 0.16, 0, 0, Math.PI * 2); ctx.fill();

    const path = blobPath();
    // jelly body
    const g = ctx.createRadialGradient(cx - R * 0.3 * sx, cy - R * 0.38 * sy, R * 0.08, cx, cy, R * 1.25);
    g.addColorStop(0, P.light); g.addColorStop(0.55, P.base); g.addColorStop(1, P.dark);
    ctx.fillStyle = g; ctx.fill(path);

    ctx.save();
    ctx.clip(path);
    ctx.translate(cx, cy); ctx.scale(R * sx, R * sy);

    drawDeco();
    // face
    drawFace();

    // sugar shell layer
    const shellA = Math.min(1, integrity * 2.2);
    if (shellA > 0) {
      const sgr = ctx.createLinearGradient(0, -1, 0, 1);
      sgr.addColorStop(0, hexA(P.shell, 0.42 * shellA));
      sgr.addColorStop(1, hexA(P.shell, 0.12 * shellA));
      ctx.fillStyle = sgr; ctx.fillRect(-1.6, -1.6, 3.2, 3.2);
      // shard facets: each broken piece sits at a slightly different angle
      for (const f of facets) {
        ctx.fillStyle = f.s > 0 ? `rgba(255,255,255,${f.s * shellA})` : hexA(P.crackDark, -f.s * 0.5 * shellA);
        ctx.beginPath(); ctx.moveTo(f.pts[0][0], f.pts[0][1]);
        for (let k = 1; k < f.pts.length; k++) ctx.lineTo(f.pts[k][0], f.pts[k][1]);
        ctx.closePath(); ctx.fill();
      }
      // chips: shell flaked away, showing the darker jelly beneath with a bright broken edge
      const lw = 1 / R;
      for (const c of chips) {
        ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]);
        for (let k = 1; k < c.length; k++) ctx.lineTo(c[k][0], c[k][1]);
        ctx.closePath();
        ctx.fillStyle = hexA(P.dark, 0.45 * shellA); ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${0.8 * shellA})`; ctx.lineWidth = 1.2 * lw; ctx.stroke();
      }
      // cracks, batched by width: frosted stress halo, dark fracture line, then a
      // thin offset glint where light catches the broken edge
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      const passes = [
        { o: 0, mul: 3.4, col: `rgba(255,255,255,${0.16 * shellA})` },
        { o: 0, mul: 1.15, col: hexA(P.crackDark, 0.95 * shellA) },
        { o: -0.9 * lw, mul: 0.55, col: hexA(P.crackLight, 0.95 * shellA) }
      ];
      for (const ps of passes) {
        ctx.strokeStyle = ps.col;
        for (const w of WB) {
          ctx.beginPath();
          for (const c of cracks) if (c.w === w) { ctx.moveTo(c.x1 + ps.o, c.y1 + ps.o); ctx.lineTo(c.x2 + ps.o, c.y2 + ps.o); }
          ctx.lineWidth = Math.max(0.6, w * ps.mul) * lw;
          ctx.stroke();
        }
      }
    }
    // re-coat shimmer sweep
    if (gloss > 0) {
      const x = -1.4 + (1 - gloss) * 2.8;
      const sh = ctx.createLinearGradient(x - 0.3, -1, x + 0.3, 1);
      sh.addColorStop(0, "rgba(255,255,255,0)"); sh.addColorStop(0.5, `rgba(255,255,255,${0.55 * gloss})`); sh.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sh; ctx.fillRect(-1.6, -1.6, 3.2, 3.2);
      gloss = Math.max(0, gloss - dt * 1.2);
    }
    // glossy highlight
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.3 * shellA})`;
    ctx.beginPath(); ctx.ellipse(-0.38, -0.55, 0.26, 0.11, -0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.3 * shellA})`;
    ctx.beginPath(); ctx.ellipse(-0.1, -0.74, 0.06, 0.035, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // rim
    ctx.lineWidth = 2;
    ctx.strokeStyle = hexA(P.dark, 0.35);
    ctx.stroke(path);

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += dt;
      if (p.t > p.life) { particles.splice(i, 1); continue; }
      p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const a = 1 - p.t / p.life;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = hexA(p.shard ? P.shell : P.crackLight, 0.9 * a);
      ctx.strokeStyle = hexA(P.crackDark, 0.35 * a); ctx.lineWidth = 1;
      ctx.beginPath();
      if (p.shard) { ctx.moveTo(-p.r, -p.r * 0.4); ctx.lineTo(p.r * 0.8, -p.r * 0.7); ctx.lineTo(p.r * 0.3, p.r * 0.8); }
      else { ctx.moveTo(-p.r, 0); ctx.lineTo(0, -p.r); ctx.lineTo(p.r, p.r * 0.5); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    if (particles.length > 400) particles.splice(0, particles.length - 400);

    requestAnimationFrame(frame);
  }

  function drawDeco() {
    for (const d of deco) {
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
      switch (P.pattern) {
        case "seeds": // little golden strawberry seeds
          ctx.fillStyle = "rgba(255,226,120,0.95)";
          ctx.beginPath(); ctx.ellipse(0, 0, 0.018, 0.032, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "rgba(160,40,60,0.35)";
          ctx.beginPath(); ctx.ellipse(0.006, 0.006, 0.012, 0.024, 0, 0, Math.PI * 2); ctx.fill();
          break;
        case "sprinkles": // candy sprinkles
          ctx.fillStyle = d.col;
          ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-0.045, -0.013, 0.09, 0.026, 0.013) : ctx.rect(-0.045, -0.013, 0.09, 0.026); ctx.fill();
          break;
        case "stars": { // twinkling galaxy stars
          const tw = 0.35 + 0.65 * Math.abs(Math.sin(time * 1.6 + d.ph));
          const r = 0.022 * d.s;
          ctx.fillStyle = `rgba(255,255,255,${tw})`;
          ctx.beginPath(); ctx.moveTo(0, -r * 2); ctx.lineTo(r * 0.5, 0); ctx.lineTo(0, r * 2); ctx.lineTo(-r * 0.5, 0); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-r * 2, 0); ctx.lineTo(0, r * 0.5); ctx.lineTo(r * 2, 0); ctx.lineTo(0, -r * 0.5); ctx.closePath(); ctx.fill();
          break;
        }
        case "dust": // matcha powder dusting
          ctx.fillStyle = "rgba(70,110,30,0.22)";
          ctx.beginPath(); ctx.arc(0, 0, 0.012 * d.s, 0, Math.PI * 2); ctx.fill();
          break;
      }
      ctx.restore();
    }
  }

  function drawFace() {
    const squeezed = press.amt > 0.4;
    ctx.fillStyle = hexA(P.blush, 0.45);
    ctx.beginPath(); ctx.ellipse(-0.48, 0.16, 0.13, 0.07, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0.48, 0.16, 0.13, 0.07, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = P.face; ctx.fillStyle = P.face;
    ctx.lineWidth = 0.035; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (squeezed) {
      // > <
      ctx.beginPath();
      ctx.moveTo(-0.4, -0.06); ctx.lineTo(-0.27, 0.0); ctx.lineTo(-0.4, 0.06);
      ctx.moveTo(0.4, -0.06); ctx.lineTo(0.27, 0.0); ctx.lineTo(0.4, 0.06);
      ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0.2, 0.07, 0.08, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      const blink = (time % 4.2) < 0.12;
      for (const ex of [-0.33, 0.33]) {
        if (blink) { ctx.beginPath(); ctx.moveTo(ex - 0.07, 0); ctx.lineTo(ex + 0.07, 0); ctx.stroke(); continue; }
        ctx.beginPath(); ctx.ellipse(ex, 0, 0.07, 0.085, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath(); ctx.arc(ex - 0.025, -0.03, 0.024, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = P.face;
      }
      // little w mouth
      ctx.beginPath();
      ctx.moveTo(-0.08, 0.15); ctx.quadraticCurveTo(-0.04, 0.21, 0, 0.16); ctx.quadraticCurveTo(0.04, 0.21, 0.08, 0.15);
      ctx.stroke();
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
