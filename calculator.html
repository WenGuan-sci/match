<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CE Graphing Calculator</title>
<meta name="description" content="A color graphing calculator in the browser, styled after the classic CE-style handhelds: home screen math, Y= editor, graphing, trace, calc tools, tables and distributions.">
<style>
:root{
  --page:#e7e9ee; --page2:#cfd4dc; --ink:#2a2f38; --muted:#5f6775;
  --body1:#30333a; --body2:#17191d; --edge:#08090b;
  --k-dark:#25272c; --k-dark2:#17181b; --k-light:#f1f2f4; --k-light2:#d6d9de;
  --k-op:#c9cdd4; --k-op2:#aab0b9; --k-blue:#4e9fdc; --k-blue2:#2f7fbd; --k-green:#5bb565; --k-green2:#3d9147;
  --l-2nd:#74bdf0; --l-alpha:#86d38c; --l-txt:#e9ebee;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#15171b; --page2:#0b0c0f; --ink:#d8dce3; --muted:#8c94a2; }
}
:root[data-theme="dark"]{ --page:#15171b; --page2:#0b0c0f; --ink:#d8dce3; --muted:#8c94a2; }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%, var(--page) 0%, var(--page2) 100%) fixed;
  background-color:var(--page);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.stage{position:relative;margin:10px auto 0;flex:none}
.calc{
  position:absolute;top:0;left:0;width:384px;transform-origin:0 0;
  background:linear-gradient(160deg,var(--body1) 0%,var(--body2) 60%,#111216 100%);
  border-radius:38px 38px 64px 64px/30px 30px 90px 90px;
  padding:16px 18px 30px;
  box-shadow:0 0 0 2px var(--edge), inset 0 2px 1px rgba(255,255,255,.12), inset 0 -6px 12px rgba(0,0,0,.5), 0 24px 50px rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.25);
}
.brand{display:flex;justify-content:space-between;align-items:baseline;padding:0 8px 8px;color:#d4d8de}
.brand b{font-size:13px;letter-spacing:.16em;font-weight:700}
.brand span{font-size:9.5px;letter-spacing:.2em;color:#9aa1ad}
.bezel{
  background:linear-gradient(#0d0e10,#060607);border-radius:16px;padding:13px 13px 11px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08);
}
.screen{position:relative;width:100%;aspect-ratio:4/3;background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px #000}
.screen canvas{width:100%;height:100%;display:block;image-rendering:auto}
.bezel-foot{display:flex;justify-content:center;gap:6px;padding-top:7px}
.bezel-foot i{width:16px;height:3px;border-radius:2px;background:#202227}
.keys{margin-top:12px}
.row{display:grid;grid-template-columns:repeat(5,1fr);column-gap:9px;row-gap:3px}
.k{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.lbl{display:flex;justify-content:space-between;align-items:flex-end;height:13px;padding:0 1px;font-size:8.6px;line-height:1;white-space:nowrap;letter-spacing:.02em}
.lbl .l2{color:var(--l-2nd);text-transform:uppercase}
.lbl .la{color:var(--l-alpha);margin-left:auto}
.lbl .l2.lower,.lbl .la.lower{text-transform:none}
.k button{
  appearance:none;border:0;margin:0;padding:0;cursor:pointer;width:100%;height:30px;
  border-radius:8px 8px 11px 11px;font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--l-txt);background:linear-gradient(var(--k-dark),var(--k-dark2));
  box-shadow:0 2px 0 #000,0 3px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .05s, box-shadow .05s, filter .05s;
  display:flex;align-items:center;justify-content:center;white-space:nowrap;
}
.k button sup{font-size:.68em;margin-left:1px}
.k button:active,.k.pressed button{transform:translateY(2px);box-shadow:0 0 0 #000,0 1px 1px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);filter:brightness(.9)}
.k button:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
.k.top button{height:20px;border-radius:5px;font-size:11px;background:linear-gradient(#3b3e45,#2a2c31)}
.k.num button{color:#1b1d21;background:linear-gradient(var(--k-light),var(--k-light2));font-size:17px;height:34px}
.k.op button{color:#1b1d21;background:linear-gradient(var(--k-op),var(--k-op2));font-size:17px;height:34px}
.k.op.enter button{font-size:12px}
.k.second button{background:linear-gradient(var(--k-blue),var(--k-blue2));color:#fff}
.k.alpha button{background:linear-gradient(var(--k-green),var(--k-green2));color:#fff}
.k.sm button{font-size:12px}
.mid{display:grid;grid-template-columns:repeat(5,1fr);column-gap:9px;row-gap:3px;margin:8px 0 6px}
.dpad{grid-column:4 / span 2;grid-row:1 / span 2;position:relative;align-self:center;justify-self:center;width:104px;height:92px}
.dpad .ring{position:absolute;inset:4px 8px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#4a4e56,#26282d 70%);box-shadow:0 3px 0 #000,0 4px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.dpad button{position:absolute;appearance:none;border:0;background:transparent;cursor:pointer;color:#dfe3e8;font-size:13px;width:34px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.dpad button:active,.dpad button.pressed{background:rgba(255,255,255,.12)}
.dpad .up{left:35px;top:6px}.dpad .down{left:35px;bottom:6px}.dpad .left{left:10px;top:31px}.dpad .right{right:10px;top:31px}
.dpad .lbl2{position:absolute;font-size:8px;color:var(--l-2nd);left:0;right:0;text-align:center;top:-11px;letter-spacing:.04em}
.hint{max-width:384px;margin:14px 16px 24px;font-size:12px;line-height:1.5;color:var(--muted);text-align:center}
.hint kbd{font:11px ui-monospace,Menlo,Consolas,monospace;padding:1px 4px;border-radius:4px;border:1px solid color-mix(in srgb,var(--muted) 45%,transparent)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="calc" id="calc">
    <div class="brand"><b>GRAPHING CALCULATOR</b><span>CE · COLOR</span></div>
    <div class="bezel">
      <div class="screen"><canvas id="lcd" aria-label="Calculator screen" role="img"></canvas></div>
      <div class="bezel-foot"><i></i><i></i><i></i></div>
    </div>
    <div class="keys" id="keys"></div>
  </div>
</div>
<p class="hint" id="hint">
  Keyboard: digits and <kbd>+ − × ÷ ^ ( ) , .</kbd> type, <kbd>Enter</kbd> evaluates, <kbd>Backspace</kbd> deletes, <kbd>Esc</kbd> is CLEAR, arrows move,
  <kbd>F1</kbd>–<kbd>F5</kbd> are Y= WINDOW ZOOM TRACE GRAPH, letters store or recall variables (<kbd>x</kbd> is X).
  Your functions, window and variables are saved in this browser.
</p>
<script>
'use strict';
(() => {
/* =================================================================
   Constants & canvas
   ================================================================= */
const SCALE = 3, W = 320, H = 240, SB = 20, CW = 12.25, LH = 22, COLS = 26, ROWS = 10;
const GH = H - SB;
const FONT = '16px "DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace';
const SMALL = '600 9.5px system-ui, -apple-system, "Segoe UI", sans-serif';
const SANS = '14px system-ui, -apple-system, "Segoe UI", sans-serif';
const cv = document.getElementById('lcd');
cv.width = W * SCALE; cv.height = H * SCALE;
const ctx = cv.getContext('2d');
ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
const gbuf = document.createElement('canvas');
gbuf.width = W * SCALE; gbuf.height = H * SCALE;
const gx = gbuf.getContext('2d');
gx.setTransform(SCALE, 0, 0, SCALE, 0, 0);

const COLORS = ['#1a5fd8', '#d8232c', '#151515', '#c81fb8', '#13a03b', '#ef7a10', '#8a4b1f', '#1f2c8f', '#2aa6e6', '#d9ab00'];
const YLAB = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZθ';
const WINVARS = { Xmin: 'xmin', Xmax: 'xmax', Xscl: 'xscl', Ymin: 'ymin', Ymax: 'ymax', Yscl: 'yscl' };

class CalcError extends Error { constructor(type) { super(type); this.type = type; } }
const err = t => { throw new CalcError(t); };

/* =================================================================
   Line editor (token based, so DEL removes whole tokens like "sin(")
   ================================================================= */
class Ed {
  constructor(t = []) { this.t = t; this.c = t.length; this.fresh = false; this.dirty = false; }
  ins(tok) { if (this.fresh) { this.t.splice(0); this.c = 0; this.fresh = false; } this.t.splice(this.c, 0, tok); this.c++; this.dirty = true; }
  del() { this.fresh = false; if (this.c < this.t.length) this.t.splice(this.c, 1); else if (this.c > 0) { this.t.splice(this.c - 1, 1); this.c--; } this.dirty = true; }
  bs() { this.fresh = false; if (this.c > 0) { this.t.splice(this.c - 1, 1); this.c--; this.dirty = true; } }
  left() { this.fresh = false; if (this.c > 0) this.c--; }
  right() { this.fresh = false; if (this.c < this.t.length) this.c++; }
  clear() { this.t.splice(0); this.c = 0; this.fresh = false; this.dirty = true; }
  set(t) { this.t.splice(0, this.t.length, ...t); this.c = this.t.length; this.dirty = true; }
  str() { return this.t.join(''); }
  curChar() { let n = 0; for (let i = 0; i < this.c; i++) n += [...this.t[i]].length; return n; }
}

/* =================================================================
   State
   ================================================================= */
const DEFAULT_WIN = { xmin: -10, xmax: 10, xscl: 1, ymin: -10, ymax: 10, yscl: 1, xres: 1 };
const S = {
  mode: { notation: 0, fix: -1, angle: 0, line: 0, cx: 0, graph: 0 },
  fmt: { coord: 0, grid: 0, axes: 0, label: 0 },
  win: { ...DEFAULT_WIN }, prevWin: null,
  tbl: { start: 0, step: 1 },
  vars: {}, ans: 0,
  Y: YLAB.map((_, i) => ({ ed: new Ed([]), on: true, color: COLORS[i], ast: undefined })),
  screen: 'home', second: false, alpha: false, alphaLock: false, off: false,
  hist: [], homeEd: new Ed([]), entries: [], entryIdx: -1,
  yeq: { sel: 0, onEq: false, scroll: 0 },
  form: null, opts: null, menu: null, err: null,
  table: { row: 0, col: 0, off: 0, fcol: 0 },
  g: { mode: 'none', cx: 160, cy: SB + GH / 2, trace: null, calc: null, prompt: null, result: null, shade: null, zoom: null, marks: [] },
  graphDirty: true, blink: true, toast: null, bright: 1,
  lists: [[], [], [], [], [], []],
  plots: [0, 1, 2].map(() => ({ on: false, type: 0, x: 0, y: 1, mark: 0 })),
  ledit: { col: 0, fcol: 0, row: 0, off: 0, ed: null },
  stat: null,
  mats: {}, statVars: {},
  medit: { n: 'A', row: -1, col: 0, fcol: 0, off: 0, ed: null },
};
const PLOTC = ['#1a5fd8', '#d8232c', '#151515'];
for (const L of LETTERS) S.vars[L] = 0;

function save() {
  try {
    localStorage.setItem('ce-calc-v1', JSON.stringify({
      mode: S.mode, fmt: S.fmt, win: S.win, tbl: S.tbl, vars: Object.fromEntries(Object.entries(S.vars).map(([k, v]) => [k, isC(v) ? { re: v.re, im: v.im } : v])), ans: typeof S.ans === 'number' || Array.isArray(S.ans) ? S.ans : 0,
      Y: S.Y.map(y => ({ t: y.ed.t, on: y.on })), entries: S.entries.slice(-20),
      lists: S.lists, plots: S.plots, mats: S.mats,
    }));
  } catch (e) { /* storage unavailable */ }
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('ce-calc-v1') || 'null');
    if (!d) return;
    Object.assign(S.mode, d.mode); Object.assign(S.fmt, d.fmt); Object.assign(S.win, d.win); Object.assign(S.tbl, d.tbl);
    Object.entries(d.vars || {}).forEach(([k, v]) => { S.vars[k] = v && typeof v === 'object' ? new C(+v.re || 0, +v.im || 0) : +v || 0; });
    if (typeof d.ans === 'number' || Array.isArray(d.ans)) S.ans = d.ans;
    if (d.mats && typeof d.mats === 'object') Object.entries(d.mats).forEach(([k, m]) => { if (/^[A-J]$/.test(k) && Array.isArray(m) && m.length && m.every(r => Array.isArray(r) && r.length === m[0].length)) S.mats[k] = m; });
    if (Array.isArray(d.Y)) d.Y.forEach((y, i) => { if (S.Y[i] && Array.isArray(y.t)) { S.Y[i].ed.set(y.t); S.Y[i].on = !!y.on; } });
    if (Array.isArray(d.entries)) S.entries = d.entries.filter(Array.isArray);
    if (Array.isArray(d.lists)) d.lists.slice(0, 6).forEach((l, i) => { if (Array.isArray(l)) S.lists[i] = l.filter(v => typeof v === 'number' && isFinite(v)).slice(0, 999); });
    if (Array.isArray(d.plots)) d.plots.slice(0, 3).forEach((p, i) => { if (p && typeof p === 'object') Object.assign(S.plots[i], p); });
  } catch (e) { /* ignore */ }
}

/* =================================================================
   Number formatting
   ================================================================= */
function strip(m) { return m.includes('.') ? m.replace(/0+$/, '').replace(/\.$/, '') : m; }
function fmtNum(v, sig = 10) {
  if (!isFinite(v)) return 'ERR';
  if (v === 0 || Math.abs(v) < 1e-300) return '0';
  const fix = S.mode.fix, notation = S.mode.notation;
  const neg = v < 0, a = Math.abs(v);
  let s = null;
  if (notation === 0 && a < 1e10 && a >= 1e-3) {
    if (fix >= 0) s = a.toFixed(fix);
    else { s = a.toPrecision(sig); if (s.includes('e')) s = null; else s = strip(s); }
  }
  if (s === null) {
    let ei = parseInt(a.toExponential(sig - 1).split('e')[1], 10);
    let shift = 0;
    if (notation === 2) shift = ((ei % 3) + 3) % 3;
    ei -= shift;
    let m = a / Math.pow(10, ei);
    const digits = fix >= 0 ? fix : Math.max(0, sig - 1 - shift);
    let ms = m.toFixed(Math.min(digits, 20));
    const lim = notation === 2 ? 1000 : 10;
    if (parseFloat(ms) >= lim) { ei += notation === 2 ? 3 : 1; m = a / Math.pow(10, ei); ms = m.toFixed(Math.min(digits, 20)); }
    if (fix < 0) ms = strip(ms);
    s = ms + 'ᴇ' + (ei < 0 ? '⁻' + (-ei) : String(ei));
  }
  if (s.startsWith('0.')) s = s.slice(1);
  return (neg ? '⁻' : '') + s;
}
function ratApprox(x, maxQ = 9999, tol = 1e-11) {
  const ax = Math.abs(x); let h0 = 0, h1 = 1, k0 = 1, k1 = 0, b = ax;
  for (let i = 0; i < 64; i++) {
    const a = Math.floor(b); const h2 = a * h1 + h0, k2 = a * k1 + k0;
    if (k2 > maxQ) break;
    h0 = h1; h1 = h2; k0 = k1; k1 = k2;
    if (Math.abs(ax - h1 / k1) <= tol * Math.max(1, ax)) return { p: x < 0 ? -h1 : h1, q: k1 };
    const f = b - a; if (f < 1e-15) break; b = 1 / f;
  }
  return null;
}
function toFrac(v) {
  if (Number.isInteger(v)) return fmtNum(v);
  const r = ratApprox(v);
  if (!r) return fmtNum(v);
  if (r.q === 1) return fmtNum(r.p);
  return (r.p < 0 ? '⁻' : '') + Math.abs(r.p) + '/' + r.q;
}

/* =================================================================
   Parser  (TI order of operations, implied multiplication)
   ================================================================= */
const POSTFIX = new Set(['²', '³', '⁻¹', '!', '°', 'ʳ', 'ᵀ']);
const STATVARS = { 'x̄': 1, 'Σx': 1, 'Σx²': 1, 'Sx': 1, 'σx': 1, 'n': 1, 'minX': 1, 'maxX': 1, 'Q1': 1, 'Med': 1, 'Q3': 1, 'ȳ': 1, 'Σy': 1, 'Σy²': 1, 'Σxy': 1, 'Sy': 1, 'σy': 1, 'minY': 1, 'maxY': 1, 'a': 1, 'b': 1, 'c': 1, 'd': 1, 'e ': 1, 'r': 1, 'r²': 1, 'R²': 1 };
const CONSTS = new Set(['π', 'e', 'rand', 'Ans', 'i', ...Object.keys(WINVARS), ...Object.keys(STATVARS)]);
const RELOPS = new Set(['=', '≠', '>', '≥', '<', '≤']);
const isY = t => /^Y[0-9]$/.test(t);
const isVar = t => t.length === 1 && LETTERS.includes(t);
const isFn = t => t.length > 1 && t.endsWith('(');
const isL = t => /^L[1-6]$/.test(t);

function lex(toks) {
  const out = []; let i = 0;
  const dig = t => t !== undefined && /^[0-9.]$/.test(t);
  while (i < toks.length) {
    const t = toks[i];
    if (dig(t) || t === 'ᴇ') {
      let m = '';
      while (dig(toks[i])) m += toks[i++];
      let e = '';
      if (toks[i] === 'ᴇ') {
        i++; let sg = '';
        if (toks[i] === '⁻') { sg = '-'; i++; }
        while (toks[i] !== undefined && /^[0-9]$/.test(toks[i])) e += toks[i++];
        if (!e) err('SYNTAX');
        e = sg + e; if (m === '') m = '1';
      }
      if (m === '.' || (m.match(/\./g) || []).length > 1) err('SYNTAX');
      out.push({ t: 'num', v: parseFloat(m + (e ? 'e' + e : '')) });
    } else if (t === ' ') i++;
    else { out.push({ t: 'tok', v: t }); i++; }
  }
  return out;
}

function parse(toks) {
  const L = lex(toks); let i = 0;
  const pk = () => L[i];
  const is = v => L[i] && L[i].t === 'tok' && L[i].v === v;
  const closeParen = () => { if (is(')')) { i++; return; } if (i >= L.length || is('→')) return; err('SYNTAX'); };
  const startsPrimary = l => {
    if (!l) return false;
    if (l.t === 'num') return true;
    const v = l.v;
    return v === '(' || v === '{' || v === '[' || isMt(v) || isFn(v) || CONSTS.has(v) || isVar(v) || isY(v) || isL(v) || v === '⁻';
  };
  function pOr() { let a = pAnd(); while (is(' or ') || is(' xor ')) { const op = L[i++].v; a = { k: 'b', op, a, b: pAnd() }; } return a; }
  function pAnd() { let a = pRel(); while (is(' and ')) { i++; a = { k: 'b', op: ' and ', a, b: pRel() }; } return a; }
  function pRel() { let a = pAdd(); while (L[i] && L[i].t === 'tok' && RELOPS.has(L[i].v)) { const op = L[i++].v; a = { k: 'b', op, a, b: pAdd() }; } return a; }
  function pAdd() { let a = pMul(); while (is('+') || is('−')) { const op = L[i++].v; a = { k: 'b', op, a, b: pMul() }; } return a; }
  function pMul() {
    let a = pComb();
    for (;;) {
      if (is('×') || is('÷')) { const op = L[i++].v; a = { k: 'b', op, a, b: pComb() }; }
      else if (startsPrimary(pk())) a = { k: 'b', op: '×', a, b: pComb() };
      else break;
    }
    return a;
  }
  function pComb() { let a = pNeg(); while (is(' nPr ') || is(' nCr ')) { const op = L[i++].v; a = { k: 'b', op, a, b: pNeg() }; } return a; }
  function pNeg() { if (is('⁻')) { i++; return { k: 'neg', a: pNeg() }; } return pPow(); }
  function pPowRhs() { if (is('⁻')) { i++; return { k: 'neg', a: pPowRhs() }; } return pPost(); }
  function pPow() { let a = pPost(); while (is('^') || is('ˣ√')) { const op = L[i++].v; a = { k: 'b', op, a, b: pPowRhs() }; } return a; }
  function pPost() {
    let a = pPrim();
    while (L[i] && L[i].t === 'tok' && POSTFIX.has(L[i].v)) {
      const op = L[i++].v;
      // degrees°minutes'seconds" entry
      if (op === '°' && L[i] && L[i].t === 'num' && L[i + 1] && L[i + 1].v === "'") {
        const m = L[i].v; i += 2; let sec = 0;
        if (L[i] && L[i].t === 'num' && L[i + 1] && L[i + 1].v === '"') { sec = L[i].v; i += 2; }
        a = { k: 'p', op: '°', a: { k: 'b', op: '+', a, b: { k: 'n', v: m / 60 + sec / 3600 } } };
        continue;
      }
      a = { k: 'p', op, a };
    }
    return a;
  }
  function pPrim() {
    const l = L[i];
    if (!l) err('SYNTAX');
    if (l.t === 'num') { i++; return { k: 'n', v: l.v }; }
    const v = l.v;
    if (v === '(') { i++; const e = pOr(); closeParen(); return e; }
    if (v === '{') {
      i++; const items = [pOr()];
      while (is(',')) { i++; items.push(pOr()); }
      if (is('}')) i++; else if (!(i >= L.length || is('→'))) err('SYNTAX');
      return { k: 'list', items };
    }
    if (v === '[') {
      i++; const rows = [];
      const close = () => { if (is(']')) i++; else if (!(i >= L.length || is('→'))) err('SYNTAX'); };
      while (is('[')) { i++; const row = [pOr()]; while (is(',')) { i++; row.push(pOr()); } close(); rows.push(row); }
      close(); if (!rows.length) err('SYNTAX');
      return { k: 'mat', rows };
    }

      }

function checkWindow() { const w = S.win; if (!(w.xmin < w.xmax) || !(w.ymin < w.ymax)) { showError('WINDOW RANGE', () => openForm('window')); return false; } return true; }
function openGraph() { if (!checkWindow() || !checkPlots()) return; S.screen = 'graph'; }
function openTrace(x) {

  g.calc = null; g.prompt = null; g.result = null; g.zoom = null; g.marks = []; g.info = null; g.shade = null;
  if (!fns.length) { g.mode = 'free'; g.cx = 160; g.cy = Math.round(SB + GH / 2); return; }

/* ---- zoom ---- */
function pushWin() { S.prevWin = { ...S.win }; }
function setWin(o) { pushWin(); Object.assign(S.win, o); S.graphDirty = true; }
function zoom(type) {
  const w = S.win;
  switch (type) {
    case 'std': setWin({ xmin: -10, xmax: 10, xscl: 1, ymin: -10, ymax: 10, yscl: 1 }); break;
    case 'dec': setWin({ xmin: -6.6, xmax: 6.6, xscl: 1, ymin: -4.1, ymax: 4.1, yscl: 1 }); break;
    case 'int': setWin({ xmin: -132, xmax: 132, xscl: 10, ymin: -82, ymax: 82, yscl: 10 }); break;
    case 'trig': { const d = S.mode.angle === 1; setWin({ xmin: d ? -352.5 : -352.5 * Math.PI / 180, xmax: d ? 352.5 : 352.5 * Math.PI / 180, xscl: d ? 90 : Math.PI / 2, ymin: -4, ymax: 4, yscl: 1 }); break; }
    case 'square': {
      const ux = (w.xmax - w.xmin) / (W - 1), uy = (w.ymax - w.ymin) / (GH - 1), u = Math.max(ux, uy);
      const cx = (w.xmin + w.xmax) / 2, cy = (w.ymin + w.ymax) / 2;
      setWin({ xmin: cx - u * (W - 1) / 2, xmax: cx + u * (W - 1) / 2, ymin: cy - u * (GH - 1) / 2, ymax: cy + u * (GH - 1) / 2 }); break;
    }
    case 'fit': {
      let lo = Infinity, hi = -Infinity;
      for (const i of activeFns()) for (let px = 0; px < W; px++) { const y = evalY(i, pxToX(px)); if (Number.isFinite(y)) { lo = Math.min(lo, y); hi = Math.max(hi, y); } }
      if (!Number.isFinite(lo)) break;
      if (lo === hi) { lo -= 1; hi += 1; }
      setWin({ ymin: lo, ymax: hi }); break;
    }
    case 'prev': if (S.prevWin) { const p = S.prevWin; S.prevWin = { ...S.win }; Object.assign(S.win, p); S.graphDirty = true; } break;
    case 'in': case 'out': case 'box': {
      openGraph(); if (S.screen !== 'graph') return;
      const g = S.g; g.mode = 'free'; g.zoom = { type, p1: null }; g.cx = 160; g.cy = Math.round(SB + GH / 2); g.trace = null;
      return;
    }
  }
  openGraph();
}
function zoomEnter() {
  const g = S.g, z = g.zoom, w = S.win, X = pxToX(g.cx), Y = pyToY(g.cy);
  if (z.type === 'box') {
    if (!z.p1) { z.p1 = { x: g.cx, y: g.cy }; return; }
    const xa = pxToX(z.p1.x), ya = pyToY(z.p1.y);
    if (xa === X || ya === Y) return;
    setWin({ xmin: Math.min(xa, X), xmax: Math.max(xa, X), ymin: Math.min(ya, Y), ymax: Math.max(ya, Y) });
    g.zoom = null; g.mode = 'none'; return;
  }
  const f = z.type === 'in' ? 1 / 4 : 4;
  const hx = (w.xmax - w.xmin) * f / 2, hy = (w.ymax - w.ymin) * f / 2;
  setWin({ xmin: X - hx, xmax: X + hx, ymin: Y - hy, ymax: Y + hy });
  g.cx = 160; g.cy = Math.round(SB + GH / 2);
}

/* ---- CALC ---- */
const CALC = {
  value: { steps: [] },
  zero: { steps: ['Left Bound?', 'Right Bound?', 'Guess?'] },
  minimum: { steps: ['Left Bound?', 'Right Bound?', 'Guess?'] },
  maximum: { steps: ['Left Bound?', 'Right Bound?', 'Guess?'] },
  intersect: { steps: ['First curve?', 'Second curve?', 'Guess?'] },
  dydx: { steps: ['dy/dx: ENTER at a point'] },
  integral: { steps: ['Lower Limit?', 'Upper Limit?'] },
};
function startCalc(type) {
  openTrace(); if (S.screen !== 'graph') return;
  const g = S.g;
  if (g.mode !== 'trace') { S.screen = 'graph'; toast('Enter a function in Y= first'); return; }
  g.shade = null;
  g.calc = { type, step: 0, vals: [], prompt() { return CALC[this.type].steps[this.step] || ''; } };
  if (type === 'value') openPrompt();
}
function openPrompt() { const ed = new Ed([]); S.g.prompt = { ed, label: 'X=' }; }
function calcConfirm() {
  const g = S.g, c = g.calc, x = g.trace.x, fi = g.trace.fi;
  const f = t => evalY(fi, t);
  try {
    switch (c.type) {
      case 'value': {
        const y = evalY(fi, x); g.calc = null; g.result = null;
        if (!Number.isFinite(y)) g.info = 'Y is undefined here';
        return;
      }
      case 'zero': case 'minimum': case 'maximum': {
        c.vals.push(x);
        if (c.step === 0) g.marks = [{ x, dir: 1 }];
        if (c.step === 1) { if (x < c.vals[0]) { [c.vals[0], c.vals[1]] = [x, c.vals[0]]; } g.marks = [{ x: c.vals[0], dir: 1 }, { x: c.vals[1], dir: -1 }]; }
        if (c.step < 2) { c.step++; return; }
        const [a, b] = c.vals;
        let r;
        if (c.type === 'zero') r = findRoot(f, a, b, x);
        else r = golden(f, a, b, c.type === 'maximum');
        g.trace.x = r; g.calc = null; g.marks = [];
        g.result = c.type === 'zero' ? 'Zero' : c.type === 'minimum' ? 'Minimum' : 'Maximum';
        return;
      }
      case 'intersect': {
        if (c.step === 0) { c.vals.push(fi); c.step++; const fns = activeFns(); if (fns.length < 2) err('INVALID'); const nxt = fns[(fns.indexOf(fi) + 1) % fns.length]; g.trace.fi = nxt; return; }
        if (c.step === 1) { if (fi === c.vals[0]) err('INVALID'); c.vals.push(fi); c.step++; return; }
        const [f1, f2] = c.vals;
        const h = t => evalY(f1, t) - evalY(f2, t);
        const span = S.win.xmax - S.win.xmin;
        let r;
        try { r = findRoot(h, Math.max(S.win.xmin, x - span / 8), Math.min(S.win.xmax, x + span / 8), x); }
        catch (e) { r = findRoot(h, S.win.xmin, S.win.xmax, x); }
        g.trace = { fi: f1, x: r }; g.calc = null; g.result = 'Intersection';
        return;
      }
      case 'dydx': {
        const h = 1e-3; const d = (f(x + h) - f(x - h)) / (2 * h);
        g.calc = null; g.result = 'dy/dx=' + (Number.isFinite(d) ? fmtNum(d, 7) : 'undefined');
        return;
      }
      case 'integral': {
        c.vals.push(x);
        if (c.step === 0) { g.marks = [{ x, dir: 1 }]; c.step++; return; }
        const [a, b] = c.vals;
        const v = simpson(t => { const y = f(t); if (!Number.isFinite(y)) err('DOMAIN'); return y; }, a, b);
        g.shade = { fi, a, b }; g.marks = []; g.calc = null;
        g.result = '∫f(x)dx=' + fmtNum(v, 8);
        return;
      }
    }
  } catch (e) {
    if (!(e instanceof CalcError)) throw e;
    g.calc = null; g.marks = [];
    showError(e.type, null);
  }
}

const ANS_OPS = new Set(['+', '−', '×', '÷', '^', '²', '³', '⁻¹', '→', '!', '►Frac', '►Dec', ' nPr ', ' nCr ', 'ˣ√', '=', '≠', '>', '≥', '<', '≤']);
function editorFor(screen) {
  if (screen === 'home') return S.homeEd;
  if (screen === 'yeq') return S.Y[S.yeq.sel].ed;
  if (screen === 'form') return S.form && S.form.ed;
  if (screen === 'graph' && S.g.prompt) return S.g.prompt.ed;
  if (screen === 'ledit') return S.ledit.ed;
  if (screen === 'medit') return S.medit.ed;
  if (screen === 'test') return S.test && S.test.ed;
  return null;
}
function insertTok(tok) {
  if (S.screen === 'graph' && !S.g.prompt) {
    if (S.g.mode === 'trace' && /^[0-9.⁻π]$|^e$|^Ans$/.test(tok)) openPrompt();
    else { goHome(); }
  }
  if (S.screen === 'yeq' && S.yeq.onEq) { S.yeq.onEq = false; S.Y[S.yeq.sel].ed.c = 0; }
  if (S.screen === 'yeq' && S.yeq.plot != null) return;
  if (S.screen === 'ledit' && !S.ledit.ed) S.ledit.ed = new Ed([]);
  if (S.screen === 'medit' && !S.medit.ed) S.medit.ed = new Ed([]);
  const ed = editorFor(S.screen);
  if (!ed) return;
  if (S.screen === 'home' && ed.t.length === 0 && ANS_OPS.has(tok)) ed.ins('Ans');
  ed.ins(tok);
  if (S.screen === 'yeq') { S.Y[S.yeq.sel].ast = undefined; S.graphDirty = true; }
}

function homeEnter() {
  const ed = S.homeEd;
  let toks = ed.t.slice();
  if (!toks.length) { if (!S.entries.length) return; toks = S.entries[S.entries.length - 1].slice(); }
  else S.entries.push(toks.slice());
  if (S.entries.length > 30) S.entries.shift();
  S.entryIdx = -1;
  try {
    const r = runLine(toks);
    if (r && r.stat) {
      S.hist.push({ t: toks.join(''), a: 'L' });
      ed.clear();
      S.stat = { title: r.stat.title, lines: r.stat.lines, scroll: 0 };
      S.screen = 'stat';
      return;
    }
    S.hist.push({ t: toks.join(''), a: 'L' });
    String(r).split('\n').forEach(line => S.hist.push({ t: line, a: 'R' }));
    if (S.hist.length > 80) S.hist.splice(0, S.hist.length - 80);
    ed.clear();
  } catch (e) {
    if (!(e instanceof CalcError)) { console.error(e); e = new CalcError('SYNTAX'); }
    showError(e.type, () => { S.screen = 'home'; ed.set(toks); });
  }
}

const HANDLERS = {
  home(a) {
    const ed = S.homeEd;
    switch (a) {
      case 'ENTER': homeEnter(); return true;
      case 'CLEAR': if (ed.t.length) ed.clear(); else S.hist = []; S.entryIdx = -1; return true;
      case 'DEL': ed.del(); return true;
      case 'BS': ed.bs(); return true;
      case 'LEFT': ed.left(); return true;
      case 'RIGHT': ed.right(); return true;
      case 'UP': case 'ENTRY': {
        if (!S.entries.length) return true;
        S.entryIdx = a === 'ENTRY' ? (S.entryIdx + 1) % S.entries.length : Math.min(S.entryIdx + 1, S.entries.length - 1);
        ed.set(S.entries[S.entries.length - 1 - S.entryIdx].slice()); return true;
      }

const REPEAT = new Set(['up', 'down', 'left', 'right', 'del']);
function bindHold(btn, id) {
  let t1 = 0, t2 = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); btn.setPointerCapture?.(e.pointerId);
    press(id);
    if (REPEAT.has(id)) t1 = setTimeout(() => { t2 = setInterval(() => press(id), 55); }, 380);
  });
  ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); press(id); } });
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
function buildKeys() {
  const root = document.getElementById('keys');
  const row = ids => { const r = document.createElement('div'); r.className = 'row'; ids.forEach(id => r.appendChild(keyEl(id))); return r; };
  root.appendChild(row(['yeq', 'window', 'zoom', 'trace', 'graph']));
  const mid = document.createElement('div'); mid.className = 'mid';
  ['second', 'mode', 'del', 'alpha', 'xt', 'stat'].forEach((id, i) => { const el = keyEl(id); el.style.gridColumn = (i % 3) + 1; el.style.gridRow = Math.floor(i / 3) + 1; mid.appendChild(el); });
  const dp = document.createElement('div'); dp.className = 'dpad';
  dp.innerHTML = '<div class="ring"></div>';
  [['up', '▲'], ['down', '▼'], ['left', '◀'], ['right', '▶']].forEach(([id, ch]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = id; b.textContent = ch; b.setAttribute('aria-label', id); b.dataset.id = id;
    bindHold(b, id); dp.appendChild(b);
  });
  mid.appendChild(dp);
  root.appendChild(mid);
  [['math', 'apps', 'prgm', 'vars', 'clear'], ['inv', 'sin', 'cos', 'tan', 'pow'], ['sq', 'comma', 'lp', 'rp', 'div'], ['log', 'n7', 'n8', 'n9', 'mul'], ['ln', 'n4', 'n5', 'n6', 'sub'], ['sto', 'n1', 'n2', 'n3', 'add'], ['on', 'n0', 'dot', 'neg', 'enter']].forEach(r => root.appendChild(row(r)));
}

/* ---- physical keyboard ---- */
const KB = { '0': 'n0', '1': 'n1', '2': 'n2', '3': 'n3', '4': 'n4', '5': 'n5', '6': 'n6', '7': 'n7', '8': 'n8', '9': 'n9', '.': 'dot', '+': 'add', '-': 'sub', '*': 'mul', '/': 'div', '^': 'pow', '(': 'lp', ')': 'rp', ',': 'comma', 'Enter': 'enter', '=': 'enter', 'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right', 'Escape': 'clear', 'Delete': 'del', 'F1': 'yeq', 'F2': 'window', 'F3': 'zoom', 'F4': 'trace', 'F5': 'graph' };
function flash(id) { const el = document.querySelector(`[data-id="${id}"]`); if (!el) return; el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 110); }
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  let id = KB[e.key];
  if (e.key === 'Backspace') { e.preventDefault(); S.second = false; doAction('BS'); save(); redraw(); return; }
  if (e.key === '{' || e.key === '}') { e.preventDefault(); doAction('i:' + e.key); save(); redraw(); return; }
  if (e.key === '!') { e.preventDefault(); doAction('i:!'); save(); redraw(); return; }
  if (!id && /^[a-zA-Z]$/.test(e.key)) {
    e.preventDefault();
    if (e.key.toLowerCase() === 'x') { flash('xt'); press('xt'); return; }
    S.second = false; doAction('i:' + e.key.toUpperCase()); save(); redraw(); return;
  }
  if (!id) return;
  if (e.repeat && !REPEAT.has(id) && id !== 'del') return;
  e.preventDefault(); flash(id); press(id);
});

/* ---- fit the device to the viewport ---- */
const stage = document.getElementById('stage'), calc = document.getElementById('calc'), hint = document.getElementById('hint');
function fit() {
  const w = 384, h = calc.offsetHeight;
  const availH = window.innerHeight - 20 - Math.min(hint.offsetHeight + 24, 80);
  const s = Math.max(0.5, Math.min((window.innerWidth - 16) / w, availH / h, 1.3));
  calc.style.transform = `scale(${s})`;
  stage.style.width = w * s + 'px'; stage.style.height = h * s + 'px';
}
window.addEventListener('resize', fit);

load();
buildKeys();
fit();
redraw();
window.__calc = { press, doAction, S, runLine, fmtNum, TESTS, openTest, runTest };
})();
</script>
